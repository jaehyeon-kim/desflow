# Patience: orders that leave the queue, and orders that refuse to join, in YAML.
#
# The YAML version of examples/builder/patience_example.py. More orders arrive than one
# packer can pack. An online order waits at most 20 seconds for the packer, and a
# walk-in order at most 10, each from its own `patience` attribute. An order that
# waits longer leaves the queue and publishes reneged. From 100 seconds the courier
# has made its last collection, so new orders balk: they publish balked and never
# join the queue.
#
# Needs no containers. Runs unpaced and ends after 120 simulation seconds.
# Run it from its folder with: desflow run patience.yaml

simulation:
  sim_id: Shop
  factor: 0
  random_seed: 42

egress:
  - type: Console

resources:
  packers: {current_cap: 1, max_cap: 4}

services:
  # An expert's estimate: at least 1 second, usually 2, at most 4.
  packing: {dist: triangular, low: 1 s, mode: 2 s, high: 4 s}

arrivals:
  orders: {dist: exponential, rate: 0.5, spawn: pack, attributes: {patience: 20}}
  walk_ins: {dist: exponential, rate: 0.1, spawn: pack, attributes: {patience: 10}}

# --8<-- [start:pack]
tasks:
  pack:
    service: packing
    resource: packers
    # Each order's own patience: it leaves the queue when it runs out.
    patience: attr.patience
    # No new orders once the courier has made its last collection.
    balk: t >= 100
    payload: {event_type: order_packed}
# --8<-- [end:pack]

# Every 30 seconds, how many orders finished, reneged and balked so far, such as
# Shop.stats.tasks.pack.reneged.
stats: {level: basic, interval: 30}

run:
  until: 120
