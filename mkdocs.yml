site_name: desflow
site_description: Realistic event streams from a SimPy simulation you can steer while it runs, written to Kafka, Redis, PostgreSQL, Parquet, JSONL and Iceberg.
# mike appends a folder to site_url when it deploys a version. canonical_version
# below makes that folder latest/, so every version's pages name the same page
# under latest/ as canonical and search engines index one copy, not one per release.
site_url: https://jaehyeon.me/desflow/
repo_url: https://github.com/jaehyeon-kim/desflow
repo_name: desflow

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  highlightjs: true
  features:
    # Choosing YAML, Builder or Low-level in one set of tabs switches every set on
    # the site, so a reader follows one way of writing throughout.
    - content.tabs.link
    # Each code block gets a copy button and a button to select lines by their
    # numbers; docs/js/code-lines.js adds a third that hides the line numbers.
    - content.code.copy
    - content.code.select
    # A section whose first page is index.md opens that page when its title is
    # chosen, so each User Guide topic folder has one page that lists its pages.
    - navigation.indexes
    # Each page ends with links to the previous and next pages of the sidebar, so the
    # sidebar is the only page order and a tutorial needs no line naming its next page.
    - navigation.footer

plugins:
  - search
  - mike:
      canonical_version: latest
  # Distributions, Statistic Names, SimPy Compatibility and CLI reference pages,
  # generated from the code by scripts/gen_pages.py during the build. Listed before
  # redirects, which must see a generated page that a redirect points to.
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  # Pages that moved. Old links, including those in published versions, land on the
  # new pages, and an entry whose page moved again points at the final page, so no
  # redirect leads to another.
  - redirects:
      redirect_maps:
        tutorials/low-level.md: learn/first-model/first-simulation.md
        tutorials/declarative.md: learn/first-model/first-simulation.md
        tutorials/yaml.md: learn/first-model/first-simulation.md
