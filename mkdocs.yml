site_name: Dynamic DES
site_description: Realistic event streams from a SimPy simulation you can steer while it runs, written to Kafka, Redis, PostgreSQL, Parquet, JSONL and Iceberg.
# mike appends a folder to site_url when it deploys a version. canonical_version
# below makes that folder latest/, so every version's pages name the same page
# under latest/ as canonical and search engines index one copy, not one per release.
site_url: https://jaehyeon.me/dynamic-des/
repo_url: https://github.com/jaehyeon-kim/dynamic-des
repo_name: dynamic-des

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  highlightjs: true
  features:
    # Choosing YAML, Builder or Low-level in one set of tabs switches every set on
    # the site, so a reader follows one way of writing throughout.
    - content.tabs.link

plugins:
  - search
  - mike:
      canonical_version: latest
  # Pages that moved: the three tutorials became First Simulation, with a tab for each
  # way of writing, and the resources page moved to Building Blocks. Old links,
  # including those in published versions, land on the new pages.
  - redirects:
      redirect_maps:
        tutorials/low-level.md: tutorials/first-simulation.md
        tutorials/declarative.md: tutorials/first-simulation.md
        tutorials/yaml.md: tutorials/first-simulation.md
        architecture/resources.md: building-blocks/resources.md
  # llms.txt and llms-full.txt for AI assistants (#41): an index of the pages with
  # their links, and the pages themselves as Markdown. The sections follow the nav,
  # and test_docs_llmstxt.py fails when a nav page is missing from them.
  - llmstxt:
      # mike serves each version under its own folder, so the links in llms.txt
      # point at latest/, where the current pages are.
      base_url: https://jaehyeon.me/dynamic-des/latest/
      full_output: llms-full.txt
      sections:
        Getting started:
          - index.md
          - getting-started.md
          - tutorials/first-simulation.md
        How Simulation Works:
          - des/how-it-works.md
          - des/simpy-and-dynamic-des.md
          - building-blocks/index.md
          - building-blocks/arrivals-and-services.md
          - building-blocks/tasks-and-processes.md
          - building-blocks/resources.md
          - des/queues-and-capacity.md
        Core Architecture:
          - architecture/overview.md
          - architecture/low-level.md
          - architecture/context.md
          - architecture/yaml.md
          - architecture/environment.md
          - architecture/registry.md
          - architecture/time.md
          - architecture/connectors.md
          - architecture/records.md
          - architecture/batching.md
        Guides:
          - guides/complex-routing.md
          - guides/avro-and-pydantic.md
          - guides/kafka-security.md
          - guides/backfill-then-live.md
          - guides/live-parameters.md
          - guides/yaml-blueprints.md
          - guides/yaml-advanced.md
          - guides/multi-resource-handoffs.md
          - guides/preemptive-breakdowns.md
          - guides/dynamic-topology.md
        Examples:
          - examples/index.md
          - examples/local.md
          - examples/kafka.md
          - examples/parquet.md
          - examples/iceberg.md
          - examples/postgres.md
          - examples/redis.md
          - examples/backfill-live.md
          - examples/advanced-postgres-orders.md
        Reference:
          - api.md
        About:
          - about/roadmap.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_full_path: false # Removes 'dynamic_des.core...' prefix
            show_root_toc_entry: true # Ensures class appears in TOC
            show_root_heading: true # Shows the class name as a heading
            show_category_heading: true # Groups methods, attributes, etc.
            # The constructor arguments belong under the class, not in a separate
            # "Functions" entry called __init__, which tells a reader nothing.
            merge_init_into_class: true
            # The default filter hides _private but not dunders, so __init__ and its
            # siblings appeared in the page. This hides every underscore name.
            filters: ["!^_"]
            docstring_section_style: table

extra:
  version:
    provider: mike
  # Same property as the blog, so both sit in one view. Filter by /dynamic-des/.
  analytics:
    provider: google
    property: G-076N8WCGWZ

# A link to a heading that does not exist fails the strict build, as a link to a
# missing page already does.
validation:
  anchors: warn

# Files the documentation shows and the tests build. They are not pages.
exclude_docs: |
  snippets/

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - First Simulation: tutorials/first-simulation.md
  - How Simulation Works:
      - Events and the Clock: des/how-it-works.md
      - SimPy and Dynamic DES: des/simpy-and-dynamic-des.md
      - Building Blocks:
          - Overview: building-blocks/index.md
          - Arrivals and Services: building-blocks/arrivals-and-services.md
          - Tasks and Processes: building-blocks/tasks-and-processes.md
          - Resources: building-blocks/resources.md
      - Queues and Capacity: des/queues-and-capacity.md
  - Core Architecture:
      - Overview: architecture/overview.md
      - Writing a Simulation:
          - Low-level API: architecture/low-level.md
          - Declarative API: architecture/context.md
          - YAML Blueprints: architecture/yaml.md
      - Runtime:
          - Environment: architecture/environment.md
          - Live Parameters: architecture/registry.md
          - Time and Pacing: architecture/time.md
          - Connectors: architecture/connectors.md
          - Records and Telemetry: architecture/records.md
          - Batching and Delivery: architecture/batching.md
  - Guides:
      - Connectors:
          - Complex Routing (Kafka): guides/complex-routing.md
          - Avro and Pydantic: guides/avro-and-pydantic.md
          - Secure Kafka: guides/kafka-security.md
      - Features:
          - Backfill Then Go Live: guides/backfill-then-live.md
          - Changing Parameters: guides/live-parameters.md
      - YAML:
          - Writing Blueprints: guides/yaml-blueprints.md
      - Custom Logic:
          - Python in a Blueprint: guides/yaml-advanced.md
          - Multi-Resource Handoffs: guides/multi-resource-handoffs.md
          - Preemptive Breakdowns: guides/preemptive-breakdowns.md
          - Dynamic Topology: guides/dynamic-topology.md
  - Examples:
      - Overview: examples/index.md
      - Local Simulation: examples/local.md
      - Kafka Digital Twin: examples/kafka.md
      - Fast-Forward to Storage:
          - Parquet: examples/parquet.md
          - Iceberg: examples/iceberg.md
      - Relational DB (Postgres): examples/postgres.md
      - In-Memory Store (Redis): examples/redis.md
      - Backfill Then Go Live: examples/backfill-live.md
      - Generate Related Records: examples/advanced-postgres-orders.md
  - API Reference: api.md
  - About:
      - Roadmap: about/roadmap.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
