site_name: desflow
site_description: Realistic event streams from a SimPy simulation you can steer while it runs, written to Kafka, Redis, PostgreSQL, Parquet, JSONL and Iceberg.
# mike appends a folder to site_url when it deploys a version. canonical_version
# below makes that folder latest/, so every version's pages name the same page
# under latest/ as canonical and search engines index one copy, not one per release.
site_url: https://jaehyeon.me/desflow/
repo_url: https://github.com/jaehyeon-kim/desflow
repo_name: desflow

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  highlightjs: true
  features:
    # Choosing YAML, Builder or Low-level in one set of tabs switches every set on
    # the site, so a reader follows one way of writing throughout.
    - content.tabs.link

plugins:
  - search
  - mike:
      canonical_version: latest
  # Pages that moved: the three tutorials became First Simulation, with a tab for each
  # way of writing, and the resources page moved to Building Blocks. Old links,
  # including those in published versions, land on the new pages.
  - redirects:
      redirect_maps:
        tutorials/low-level.md: tutorials/first-simulation.md
        tutorials/declarative.md: tutorials/first-simulation.md
        tutorials/yaml.md: tutorials/first-simulation.md
        architecture/resources.md: building-blocks/resources.md
        # The page named after the package before the rename to desflow in 0.20.0.
        des/simpy-and-dynamic-des.md: des/simpy-and-desflow.md
        # Pages removed before 0.17.0. Older versions name latest/<page> as their
        # canonical address, so each needs a page there.
        architecture/paradigms.md: architecture/overview.md
        concepts.md: des/how-it-works.md
        examples/declarative/history.md: examples/backfill-live.md
        examples/declarative/iceberg.md: examples/iceberg.md
        examples/declarative/kafka.md: examples/kafka.md
        examples/declarative/local.md: examples/local.md
        examples/declarative/parquet.md: examples/parquet.md
        examples/declarative/postgres.md: examples/postgres.md
        examples/declarative/redis.md: examples/redis.md
        examples/history.md: examples/backfill-live.md
        examples/imperative/history.md: examples/backfill-live.md
        examples/imperative/iceberg.md: examples/iceberg.md
        examples/imperative/kafka.md: examples/kafka.md
        examples/imperative/local.md: examples/local.md
        examples/imperative/parquet.md: examples/parquet.md
        examples/imperative/postgres.md: examples/postgres.md
        examples/imperative/redis.md: examples/redis.md
        examples/yaml/advanced-postgres-orders.md: examples/advanced-postgres-orders.md
        examples/yaml/backfill-live.md: examples/backfill-live.md
        examples/yaml/iceberg.md: examples/iceberg.md
        examples/yaml/kafka.md: examples/kafka.md
        examples/yaml/local.md: examples/local.md
        examples/yaml/parquet.md: examples/parquet.md
        examples/yaml/postgres.md: examples/postgres.md
        examples/yaml/redis.md: examples/redis.md
        guides/data-lake-ingestion.md: architecture/connectors.md
        tutorials/01-first-factory.md: tutorials/first-simulation.md
        tutorials/02-distributions-resources.md: tutorials/first-simulation.md
        tutorials/03-connecting-kafka.md: examples/kafka.md
  # llms.txt and llms-full.txt for AI assistants (#41): an index of the pages with
  # their links, and the pages themselves as Markdown. hooks/llmstxt_sections.py
  # builds the sections from the nav.
  - llmstxt:
      # mike serves each version under its own folder, so the links in llms.txt
      # point at latest/, where the current pages are.
      base_url: https://jaehyeon.me/desflow/latest/
      full_output: llms-full.txt
      sections: {} # required by the plugin; filled from the nav by the hook
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_full_path: false # Removes 'desflow.core...' prefix
            show_root_toc_entry: true # Ensures class appears in TOC
            show_root_heading: true # Shows the class name as a heading
            show_category_heading: true # Groups methods, attributes, etc.
            # The constructor arguments belong under the class, not in a separate
            # "Functions" entry called __init__, which tells a reader nothing.
            merge_init_into_class: true
            # The default filter hides _private but not dunders, so __init__ and its
            # siblings appeared in the page. This hides every underscore name.
            filters: ["!^_"]
            docstring_section_style: table

extra:
  version:
    provider: mike
  # Same property as the blog, so both sit in one view. Filter by /desflow/.
  analytics:
    provider: google
    property: G-076N8WCGWZ

# A link to a heading that does not exist fails the strict build, as a link to a
# missing page already does.
validation:
  anchors: warn

# Files the documentation shows and the tests build. They are not pages.
exclude_docs: |
  snippets/

hooks:
  - hooks/llmstxt_sections.py

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - First Simulation: tutorials/first-simulation.md
  - How Simulation Works:
      - What Is DES?: des/how-it-works.md
      - SimPy and desflow: des/simpy-and-desflow.md
      - Building Blocks:
          - Overview: building-blocks/index.md
          - Arrivals and Services: building-blocks/arrivals-and-services.md
          - Tasks and Processes: building-blocks/tasks-and-processes.md
          - Resources: building-blocks/resources.md
      - Queues and Capacity: des/queues-and-capacity.md
  - Core Architecture:
      - Overview: architecture/overview.md
      - Writing a Simulation:
          - Low-level API: architecture/low-level.md
          - Builder API: architecture/context.md
          - YAML Blueprints: architecture/yaml.md
      - Runtime:
          - Environment: architecture/environment.md
          - Live Parameters: architecture/registry.md
          - Time and Pacing: architecture/time.md
          - Connectors: architecture/connectors.md
          - Records and Telemetry: architecture/records.md
          - Batching and Delivery: architecture/batching.md
  - Guides:
      - Connectors:
          - Complex Routing (Kafka): guides/complex-routing.md
          - Avro and Pydantic: guides/avro-and-pydantic.md
          - Secure Kafka: guides/kafka-security.md
      - Features:
          - Backfill Then Go Live: guides/backfill-then-live.md
          - Changing Parameters: guides/live-parameters.md
      - YAML:
          - Writing Blueprints: guides/yaml-blueprints.md
      - Custom Logic:
          - Python in a Blueprint: guides/yaml-advanced.md
          - Multi-Resource Handoffs: guides/multi-resource-handoffs.md
          - Preemptive Breakdowns: guides/preemptive-breakdowns.md
          - Dynamic Topology: guides/dynamic-topology.md
  - Examples:
      - Overview: examples/index.md
      - Local Simulation: examples/local.md
      - Kafka Digital Twin: examples/kafka.md
      - Fast-Forward to Storage:
          - Parquet: examples/parquet.md
          - Iceberg: examples/iceberg.md
      - Relational DB (Postgres): examples/postgres.md
      - In-Memory Store (Redis): examples/redis.md
      - Backfill Then Go Live: examples/backfill-live.md
      - Generate Related Records: examples/advanced-postgres-orders.md
  - API Reference: api.md
  - About:
      - Roadmap: about/roadmap.md
      - Changelog: about/changelog.md

markdown_extensions:
  - attr_list
  - md_in_html
  - neoteroi.timeline
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/neoteroi-mkdocs.css
  - css/roadmap.css
