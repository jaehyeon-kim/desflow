markdown_extensions:
  # Admonitions, and ??? blocks that a reader opens, such as a tutorial's full files
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - neoteroi.timeline
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - css/neoteroi-mkdocs.css
  - css/roadmap.css
  - css/tables.css
  - css/code-lines.css

extra_javascript:
  - js/code-lines.js
  - js/moved-anchors.js
