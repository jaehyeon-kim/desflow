# The First Simulation tutorial, step 3: the shop on Kafka.
# Needs Kafka: odctl up kafka-lite. Runs until stopped with Ctrl+C.
simulation:
  sim_id: Shop
  factor: 1.0
  random_seed: 42

resources:
  packers: {current_cap: 1, max_cap: 5}

services:
  packing: {dist: normal, mean: 3.0, std: 0.5}

arrivals:
  orders: {dist: exponential, rate: 0.5, spawn: pack_order}

tasks:
  pack_order: {service: packing, resource: packers, payload: {}, id_field: order_id}

# --8<-- [start:kafka]
ingress:
  # Reads {"path_id": ..., "value": ...} messages
  - type: Kafka
    config: {topic: sim-config, bootstrap_servers: localhost:9092}

egress:
  - type: Kafka
    config:
      bootstrap_servers: localhost:9092
      event_topic: sim-events
      telemetry_topic: sim-telemetry
# --8<-- [end:kafka]
