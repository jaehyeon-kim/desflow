# Connectors in a blueprint, as the YAML Blueprints page shows them. The services
# are the odctl profiles the examples use; tests/docs only loads this file.
simulation:
  sim_id: Shop
  factor: 1

# --8<-- [start:ingress]
ingress:
  - type: Local
    config:
      schedule:
        - [10.0, Shop.resources.packers.current_cap, 3]
  - type: Kafka
    config:
      topic: sim-config
      bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
# --8<-- [end:ingress]

# --8<-- [start:egress]
egress:
  - type: Kafka
    config:
      bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      event_topic: sim-events
      telemetry_topic: sim-telemetry
    batch_size: 50
    flush_interval: 0.5
  - type: Parquet
    config:
      default_path: warehouse/events.parquet
      # A mapping becomes PyArrow's S3FileSystem; type: local is the local disk
      filesystem:
        type: s3
        endpoint_override: 127.0.0.1:8333
        scheme: http
        access_key: user
        secret_key: password
    batch_size: 200000
  - type: Jsonl
    config:
      path_router: !python routing_logic.daily_path
  - type: Postgres
    config:
      connection_dsn: postgresql://user:password@127.0.0.1:5432/odctl
      table_name: orders
      upsert_keys: [order_id]
  - type: Redis
    config:
      url: redis://user:password@127.0.0.1:6379/0
      stream_name: events
# --8<-- [end:egress]

resources:
  packers: {current_cap: 1, max_cap: 5}

# --8<-- [start:before]
run:
  until: 1 hour
  before:
    - !python routing_logic.make_output_folder
# --8<-- [end:before]
