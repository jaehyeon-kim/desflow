# Connectors in a blueprint, as the Ingress and Egress pages show them in their YAML
# tabs, beside connectors.py. The services are the odctl profiles the examples use;
# tests/docs only loads this file.
simulation:
  sim_id: Shop
  factor: 1

ingress:
  # --8<-- [start:local-ingress]
  # 10 wall-clock seconds after the start, set the packers capacity to 3
  - type: Local
    config:
      schedule:
        - [10.0, Shop.resources.packers.current_cap, 3]
  # --8<-- [end:local-ingress]
  # --8<-- [start:file-ingress]
  # Applies an entry of params.yaml when it first appears or its value changes
  - type: File
    config:
      path: params.yaml
      poll: 1.0
  # --8<-- [end:file-ingress]
  # --8<-- [start:kafka-ingress]
  # Reads {"path": ..., "value": ...} messages from the sim-config topic
  - type: Kafka
    config:
      topic: sim-config
      bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
  # --8<-- [end:kafka-ingress]
  # --8<-- [start:redis-ingress]
  # Reads {"path": ..., "value": ...} messages from a Pub/Sub channel
  - type: Redis
    config:
      url: redis://user:password@127.0.0.1:6379/0
      channel_name: simulation_params
  # --8<-- [end:redis-ingress]
  # --8<-- [start:postgres-ingress]
  # Applies new rows (path, value) of simulation_params, checking every 2 seconds
  - type: Postgres
    config:
      connection_dsn: postgresql://user:password@127.0.0.1:5432/odctl
      table_name: simulation_params
      poll_interval: 2.0
  # --8<-- [end:postgres-ingress]

egress:
  # --8<-- [start:console-egress]
  - type: Console
  # --8<-- [end:console-egress]
  # --8<-- [start:console-json]
  # One JSON line per record on stdout, stream_type included
  - type: Console
    config: {format: json}
  # --8<-- [end:console-json]
  # --8<-- [start:kafka-egress]
  - type: Kafka
    config:
      bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      event_topic: sim-events
      telemetry_topic: sim-telemetry
  # --8<-- [end:kafka-egress]
  # --8<-- [start:storage-egress]
  # Parquet files on the local disk, output/events_<8 hex digits>.parquet
  - type: Parquet
    config:
      default_path: output/events.parquet
  # JSON Lines files on S3-compatible storage, here SeaweedFS from odctl; a mapping
  # becomes PyArrow's S3FileSystem
  - type: Jsonl
    config:
      default_path: warehouse/events.jsonl
      filesystem:
        type: s3
        access_key: user
        secret_key: password
        endpoint_override: 127.0.0.1:8333
        scheme: http
  # --8<-- [end:storage-egress]
  # Writes each event under its day, with the router in routing_logic.py
  - type: Jsonl
    config:
      path_router: !python routing_logic.daily_path
  # --8<-- [start:redis-egress]
  # XADD to the events stream, unless a record's value names another in __stream__
  - type: Redis
    config:
      url: redis://user:password@127.0.0.1:6379/0
      stream_name: events
  # --8<-- [end:redis-egress]
  # --8<-- [start:postgres-egress]
  - type: Postgres
    config:
      connection_dsn: postgresql://user:password@127.0.0.1:5432/odctl
      table_name: orders
  # --8<-- [end:postgres-egress]
  # --8<-- [start:postgres-upsert]
  - type: Postgres
    config:
      connection_dsn: postgresql://user:password@127.0.0.1:5432/odctl
      table_name: orders
      upsert_keys: [order_id]
  # --8<-- [end:postgres-upsert]
  # --8<-- [start:iceberg-egress]
  # A mapping of PyIceberg catalog properties, here the REST catalog of odctl.
  # One commit per flush, so this sink gets a large batch of its own
  - type: Iceberg
    config:
      default_table: sim.events
      catalog:
        name: odctl
        type: rest
        uri: http://127.0.0.1:8181
        warehouse: s3://warehouse/
        s3.endpoint: http://127.0.0.1:8333
        s3.access-key-id: user
        s3.secret-access-key: password
        s3.region: us-east-1
    batch_size: 200000
  # --8<-- [end:iceberg-egress]
  # --8<-- [start:iceberg-upsert]
  - type: Iceberg
    config:
      default_table: sim.orders
      upsert_keys: {sim.orders: [order_id]}
      catalog:
        name: odctl
        type: rest
        uri: http://127.0.0.1:8181
        warehouse: s3://warehouse/
    batch_size: 200000
  # --8<-- [end:iceberg-upsert]

resources:
  packers: {current_cap: 1, max_cap: 5}

# --8<-- [start:before]
run:
  until: 1 hour
  before:
    - !python routing_logic.make_output_folder
# --8<-- [end:before]
