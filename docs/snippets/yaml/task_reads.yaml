# The Task Flow page: a task reads the finished records of other tasks to set how long
# it takes. Run it with: desflow run task_reads.yaml
simulation: {sim_id: Shop, factor: 0, random_seed: 2}

egress:
  - {type: Console}

arrivals:
  orders: {dist: exponential, rate: 0.2, spawn: pack}

tasks:
  pack:
    service_time: {gen: uniform, low: 1, high: 4, decimals: 1}
    payload:
      weight: {gen: uniform, low: 0.5, high: 5, decimals: 1}
      customer_id: {gen: integer, bounds: [1, 3]}
    next: deliver
  # --8<-- [start:reads]
  deliver:
    # The mean weight of the last 5 packings over 1 kg, as seconds
    service_time:
      gen: aggregate
      task: pack
      path: weight
      last: 5
      where: weight > 1
      function: mean
    payload: {event_type: delivered}
    next: restock
  restock:
    # The newest weight of one customer, chosen from the newest row of each customer
    service_time:
      gen: lookup
      task: pack
      path: weight
      strategy: last
      latest_by: customer_id
    payload: {event_type: restocked}
    next: inspect
  inspect:
    # Two past weights, drawn without replacement, mostly from the older part of the
    # rows
    service_time:
      gen: expr
      expr: sum(weights)
      names:
        weights:
          gen: repeat
          times: 2
          value:
            gen: lookup
            task: pack
            path: weight
            distinct: true
            histogram:
              - {bin: 2, frequency: 8}
              - {bin: 8, frequency: 2}
    payload: {event_type: inspected}
    next: settle
  settle:
    # As long as the last settling took, and 2 s for the first
    service_time: {gen: previous, path: took, default: 2}
    payload:
      took: {gen: uniform, low: 1, high: 3, decimals: 1}
    next: finish
  finish:
    # As long as the settling that came before took
    service_time: {gen: upstream, path: took}
    payload: {event_type: finished}
  # --8<-- [end:reads]

run: {until: 100 s}
