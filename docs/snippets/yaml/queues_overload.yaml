# Queues and Capacity: three packers keep up with 1.8 orders a second until a rush
# at 10 minutes raises the rate to 2.4, past what they can pack.
# Watch the queue grow with:
#   desflow run queues_overload.yaml --stdout | jq -c 'select(.path_id? == "Shop.stats.resources.packers.queue_length") | [.sim_ts, .value]'
simulation:
  sim_id: Shop
  factor: 0  # unpaced; 1 plays the half hour in real time
  random_seed: 42

services:
  packing: {dist: constant, value: 1.5 s}

arrivals:
  orders: {dist: exponential, rate: 1.8, spawn: pack_order}

resources:
  packers: {current_cap: 3, max_cap: 10}

tasks:
  pack_order:
    service: packing
    resource: packers
    payload: {event_type: order_packed}

# --8<-- [start:rush]
# The rush: 2.4 orders a second from 10 minutes, utilisation 2.4 x 1.5 / 3 = 1.2
scenario:
  - {at: 10 min, path: Shop.arrival.orders.rate, value: 2.4}

# The queue length, published every 5 minutes
stats: {level: minimal, interval: 5 min}
# --8<-- [end:rush]

egress:
  - type: Console

run:
  until: 30 min
