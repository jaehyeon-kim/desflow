# Telemetry entries of the YAML Blueprints page.
# Run it with: ddes run telemetry.yaml
simulation:
  sim_id: Shop
  factor: 0

egress:
  - type: Console

resources:
  packers: {current_cap: 2, max_cap: 5}

services:
  packing: {dist: normal, mean: 3.0, std: 0.5}

arrivals:
  orders: {dist: exponential, rate: 0.5, spawn: pack}

tasks:
  pack: {service: packing, resource: packers, payload: {}}

# --8<-- [start:telemetry]
telemetry:
  # Every 5 simulation seconds, as Shop.packers_busy and Shop.packers_waiting
  - interval: 5
    publish:
      packers_busy: packers.in_use
      packers_waiting: packers.queue_length
  # Every 60 seconds, the share of the packers in use, in percent
  - interval: 60
    publish:
      packers_utilization: packers.utilization
# --8<-- [end:telemetry]

run:
  until: 5 min
