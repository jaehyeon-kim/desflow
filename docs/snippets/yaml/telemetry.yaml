# A custom reading in a blueprint, for the YAML Format page.
# Run it with: desflow run telemetry.yaml
simulation:
  sim_id: Shop
  factor: 0

egress:
  - type: Console

resources:
  packers: {current_cap: 2, max_cap: 5}

services:
  packing: {dist: normal, mean: 3 s, std: 0.5 s}

arrivals:
  # An order every 2 s on average (rate 0.5)
  orders: {dist: exponential, rate: 0.5, spawn: pack}

tasks:
  pack: {service: packing, resource: packers, payload: {event_type: order_packed}}

# --8<-- [start:telemetry]
telemetry:
  # Every 5 simulation seconds, calls packers_report(context), which publishes
  # Shop.waiting_per_packer and Shop.arrival_rate with context.publish
  - interval: 5
    function: !python shop_logic.packers_report
# --8<-- [end:telemetry]

run:
  until: 5 min
