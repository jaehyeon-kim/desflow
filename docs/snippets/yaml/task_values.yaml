# The Task Flow page: the key of a task's records, the values a task draws, values
# read from earlier records, and values carried to the next task. Customers sign up
# and place orders. Each order is packed, and one in ten is packed again. The shop
# closes at 100 seconds, and night sign-ups start.
# Run it with: desflow run task_values.yaml
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

egress:
  - {type: Console}

resources:
  packers: {current_cap: 2, max_cap: 4}

services:
  packing: {dist: constant, value: 1.5 s}

arrivals:
  # A sign-up every 10 s on average, an order every 2 s on average, and the end of the
  # day
  signups: {dist: exponential, rate: 0.1, spawn: sign_up}
  orders: {dist: exponential, rate: 0.5, spawn: place_order}
  closing: {dist: constant, value: 100 s, max_events: 1, spawn: close_shop}
  # Sign-ups after closing, which start when close_shop turns the source on
  night: {dist: exponential, rate: 0.05, active: false, spawn: sign_up}

tasks:
  # --8<-- [start:key]
  sign_up:
    payload:
      customer_id: {gen: sequence, format: "c-{}"}
    # The finished record carries the customer id as its key
    key_field: customer_id
  # --8<-- [end:key]
  # --8<-- [start:earlier]
  place_order:
    # A value drawn here is read by name below
    vars:
      total: {gen: uniform, low: 5, high: 200, decimals: 2}
    payload:
      # A customer who signed up earlier
      customer_id: {gen: lookup, task: sign_up, path: customer_id}
      total: {gen: var, name: total}
      # This stream's last running_total plus this order's total
      running_total:
        gen: add
        args:
          - {gen: previous, path: running_total, default: 0}
          - {gen: var, name: total}
    next: pack
  # --8<-- [end:earlier]
  # --8<-- [start:draws]
  pack:
    service: packing
    resource: packers
    # Drawn once for each order, so a second packing keeps the box
    vars_once:
      box: {gen: one_of, choices: [small, large]}
    # Drawn for each packing, when it starts because on_start is written
    vars:
      weight: {gen: uniform, low: 0.5, high: 5, decimals: 1}
    # Published as one record when the packing starts
    on_start:
      weight: {gen: var, name: weight}
    # Drawn after the service, and able to read the values above
    finish_vars:
      fee: {gen: expr, expr: "round(weight * 0.4, 2)"}
    payload:
      box: {gen: var, name: box}
      weight: {gen: var, name: weight}
      fee: {gen: var, name: fee}
      # The total of the order that came here
      total: {gen: upstream, path: total}
    # One packing in ten is done again
    next:
      weights: {pack: 1, finish: 9}
  # --8<-- [end:draws]
  finish:
    payload: {event_type: order_done}
  # --8<-- [start:carry]
  close_shop:
    payload: {event_type: shop_closed}
    # Written now, and read as arg.closed_at by this task and the tasks after it
    set_args:
      closed_at: {gen: expr, expr: t}
    # Turn on the source of the night sign-ups, as the task finishes
    activate: night
    next: day_report
  day_report:
    payload:
      closed_at: {gen: expr, expr: arg.closed_at}
      mean_total:
        gen: aggregate
        task: place_order
        path: total
        last: 10
        function: mean
  # --8<-- [end:carry]

run: {until: 150 s}
