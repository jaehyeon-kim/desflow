# The First Simulation tutorial, step 2: random machining times and two capacity
# changes at set simulation times.
# Run it with: ddes run factory_changes.yaml
# --8<-- [start:random]
simulation:
  sim_id: Factory_A
  factor: 1.0
  random_seed: 42  # the same draws on every run

resources:
  lathe: {current_cap: 1, max_cap: 5}  # room for up to 5 lathes

services:
  # Milling takes 3 seconds on average, give or take 0.5
  milling: {dist: normal, mean: 3.0, std: 0.5}
# --8<-- [end:random]

arrivals:
  parts: {dist: exponential, rate: 0.5, spawn: process_part}

tasks:
  process_part: {service: milling, resource: lathe, payload: {}, id_field: part_id}

egress:
  - type: Console

telemetry:
  - interval: 5
    publish: {lathe_capacity: lathe.capacity, lathe_queue: lathe.queue_length}

# --8<-- [start:changes]
scenario:
  - {at: 10, path: Factory_A.resources.lathe.current_cap, value: 3}
  - {at: 20, path: Factory_A.resources.lathe.current_cap, value: 2}
# --8<-- [end:changes]

run:
  until: 30
