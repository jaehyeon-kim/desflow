# The distributions of the Arrivals and Services page, in one blueprint.
# Run it with: desflow run arrivals_services.yaml
simulation:
  sim_id: Shop
  factor: 0
  # --8<-- [start:seed]
  # The same draws on every run; leave it out to draw a seed and log it
  random_seed: 42
  # --8<-- [end:seed]

egress:
  - type: Console

resources:
  packers: {current_cap: 2, max_cap: 5}

arrivals:
  # --8<-- [start:exponential]
  # under arrivals: an order every 2 seconds on average
  orders: {dist: exponential, rate: 0.5, spawn: pack}
  # --8<-- [end:exponential]

services:
  # 3 s on average, give or take 0.5 s
  packing: {dist: normal, mean: 3 s, std: 0.5 s}
  # --8<-- [start:durations]
  # under services: every time-valued parameter takes a duration
  support_call: {dist: lognormal, mean: 5 min, std: 3 min}
  # --8<-- [end:durations]

tasks:
  pack: {service: packing, resource: packers, payload: {event_type: order_packed}}

run:
  until: 1 min
