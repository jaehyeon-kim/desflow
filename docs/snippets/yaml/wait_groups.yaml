# The Wait for One or All guide: every kind of wait group, on one order's way.
# Run it with: desflow run wait_groups.yaml
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

resources:
  packers: {current_cap: 1, max_cap: 1, queue: priority}
  vans: {current_cap: 1, max_cap: 1}

signals:
  second_done: {once: false}

containers:
  boxes: {current_cap: 50, max_cap: 50, level: 6}

stores:
  shelf: {current_cap: 100, max_cap: 100}

services:
  packing: {dist: constant, value: 3 s}
  driving: {dist: constant, value: 20 s}

arrivals:
  orders: {dist: constant, value: 10 s, spawn: print}

tasks:
  print:
    # --8<-- [start:all]
    # Go on once both the label and the invoice are printed
    wait:
      all:
        label: {timeout: 2 s}
        invoice: {timeout: 4 s}
    # --8<-- [end:all]
    payload: {event_type: printed}
    next: approve
  approve:
    # --8<-- [start:at-least]
    # Go on once two of the three checks have answered
    wait:
      at_least: 2
      of:
        stock: {timeout: 1 s}
        payment: {timeout: 3 s}
        address: {timeout: 6 s}
    # --8<-- [end:at-least]
    payload: {event_type: approved}
    next: reserve
  reserve:
    # --8<-- [start:get]
    # Two boxes, or go on without them after 5 seconds with the value "no boxes"
    wait:
      any:
        boxes:
          get: {container: boxes, amount: 2}
        limit:
          timeout: {after: 5 s, value: no boxes}
    # --8<-- [end:get]
    payload: {event_type: reserved}
    next: pack
  pack:
    # --8<-- [start:request]
    # A packer asked for with priority 1 and without taking the unit from another order,
    # or give up after 30 seconds; a packer won is held through packing
    wait:
      any:
        unit:
          request: {resource: packers, priority: 1, preempt: false}
        limit: {timeout: 30 s}
    # --8<-- [end:request]
    service: packing
    payload: {event_type: packed}
    # --8<-- [start:spawn]
    # Two deliveries start for each packed order
    spawn: {task: deliver, count: 2}
    # --8<-- [end:spawn]
    next: close
  deliver:
    service: driving
    resource: vans
    payload: {event_type: delivered}
  close:
    # --8<-- [start:running]
    # Wait until every flow of the deliver task has ended, unless it has left with the
    # van
    wait:
      running: {task: deliver, where: process.target != 'service', whole_flow: true}
    # --8<-- [end:running]
    payload: {event_type: closed}
    next: file
  file:
    # --8<-- [start:put]
    # Put the closed order's payload on the shelf, waiting while the shelf is full
    wait:
      put: {store: shelf}
    # --8<-- [end:put]
    payload: {event_type: filed}
    next: ship
  ship:
    # --8<-- [start:nested]
    # Go on once the invoice is printed and either two boxes are taken or 5 seconds pass
    wait:
      all:
        invoice: {timeout: 4 s}
        either:
          any:
            boxes:
              get: {container: boxes, amount: 2}
            limit: {timeout: 5 s}
    # --8<-- [end:nested]
    payload: {event_type: shipped}
    next: inspect
  inspect:
    # --8<-- [start:each-when]
    # Pack three boxes and go on when two are done; the group reads only done_count
    wait:
      all:
        boxes:
          each: [2, 5, 9]
          group: {when: done_count >= 2}
          branch:
            timeout: {after: each.value}
    # --8<-- [end:each-when]
    payload: {event_type: inspected}
    next: sort
  sort:
    # --8<-- [start:child]
    # Start a child flow of label_box for this entity, with the box number as arg.box
    wait:
      any:
        child:
          task: label_box
          args: {box: 7}
        limit: {timeout: 30 s}
    # --8<-- [end:child]
    payload: {event_type: sorted}
    next: stage
  stage:
    # --8<-- [start:handles]
    # Open three child flows and two requests for a van, without waiting for them
    open:
      boxes:
        each: 3
        branch:
          task: label_box
          args:
            box: {gen: expr, expr: each.index}
      seats:
        each: 2
        branch: {request: vans}
    # Hear the end of the second child flow
    listen:
      handle: boxes
      index: 1
      on:
        - fire: {signal: second_done}
    service_time: 1 s
    # Stop the third child flow, give up the second request, and give back the first
    interrupt: {handle: boxes, index: 2, cause: stop}
    cancel: {handle: seats, index: 1}
    release: {handle: seats, index: 0}
    # --8<-- [end:handles]
    payload: {event_type: staged}
  label_box:
    service: packing
    on_interrupt: abandon
    on_interrupt_next: box_stopped
    payload:
      event_type: box_labelled
      box: {gen: expr, expr: arg.box}
  box_stopped:
    payload:
      event_type: box_stopped
      box: {gen: expr, expr: arg.box}

egress:
  - {type: Console}

run: {until: 5 min}
