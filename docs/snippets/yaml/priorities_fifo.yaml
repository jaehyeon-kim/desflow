# The Priorities tutorial: the same shop served first come, first served.
# Run it with: desflow run priorities_fifo.yaml
# It is priorities.yaml without queue: priority and without the two priority lines.
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

# --8<-- [start:queue]
resources:
  # The packer serves the oldest request first
  packers: {current_cap: 1, max_cap: 4}
# --8<-- [end:queue]

services:
  packing: {dist: constant, value: 1.5 s}

arrivals:
  # An order every 1.67 s on average in all (0.6 a second), one in four express;
  # ORDERS_RATE and EXPRESS_RATE set other rates
  orders: {dist: exponential, rate: "${ORDERS_RATE:-0.45}", spawn: pack_order}
  express: {dist: exponential, rate: "${EXPRESS_RATE:-0.15}", spawn: pack_express}

# --8<-- [start:tasks]
tasks:
  pack_order:
    service: packing
    resource: packers
    payload: {event_type: order_packed}
  pack_express:
    service: packing
    resource: packers
    payload: {event_type: express_packed}
# --8<-- [end:tasks]

# The mean wait of each task at the end
stats: {level: typical, interval: 1 h}

egress:
  - {type: Console}

run: {until: 1 h}
