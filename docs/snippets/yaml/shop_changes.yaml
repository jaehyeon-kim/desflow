# The First Simulation tutorial, step 2: random packing times and two capacity
# changes at set simulation times.
# Run it with: desflow run shop_changes.yaml
# --8<-- [start:random]
simulation:
  sim_id: Shop
  factor: 1.0
  random_seed: 42  # the same draws on every run

resources:
  packers: {current_cap: 1, max_cap: 5}  # room for up to 5 packers

services:
  # Packing takes 3 seconds on average, give or take 0.5
  packing: {dist: normal, mean: 3.0, std: 0.5}
# --8<-- [end:random]

arrivals:
  orders: {dist: exponential, rate: 0.5, spawn: pack_order}

tasks:
  pack_order: {service: packing, resource: packers, payload: {}, id_field: order_id}

egress:
  - type: Console

telemetry:
  - interval: 5
    publish: {packer_capacity: packers.capacity, packer_queue: packers.queue_length}

# --8<-- [start:changes]
scenario:
  - {at: 10, path: Shop.resources.packers.current_cap, value: 3}
  - {at: 20, path: Shop.resources.packers.current_cap, value: 2}
# --8<-- [end:changes]

run:
  until: 30
