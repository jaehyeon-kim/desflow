# The Competing Resources tutorial: the same shop without the handoff.
# Run it with: desflow run competing_resources_free.yaml
# It is competing_resources.yaml without the keep line.
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

resources:
  picker: {current_cap: 1, max_cap: 2}
  bench: {current_cap: 1, max_cap: 2}

services:
  picking: {dist: constant, value: 1 s}
  packing: {dist: exponential, rate: 0.5}

arrivals:
  orders: {dist: exponential, rate: 0.4, spawn: pick_order}

# --8<-- [start:tasks]
tasks:
  pick_order:
    service: picking
    resource: picker
    payload: {event_type: order_picked}
    next: pack_order
  pack_order:
    service: packing
    resource: bench
    payload: {event_type: order_packed}
# --8<-- [end:tasks]

# The mean wait of each task and the picker's busy share, at the end
stats: {level: typical, interval: 1 h}

egress:
  - {type: Console}

run: {until: 1 h}
