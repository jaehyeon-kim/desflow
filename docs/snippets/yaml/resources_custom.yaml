# The Resources page: a resource built from a class of your own.
# Run it with: desflow run resources_custom.yaml
simulation:
  sim_id: Shop
  factor: 0
  random_seed: 42

# --8<-- [start:declare]
resources:
  # A subclass of ResourceBase that keeps how long each request waited
  packers: {current_cap: 1, max_cap: 4, type: !python shop_logic.LoggedPackers}
# --8<-- [end:declare]

services:
  packing: {dist: constant, value: 1.5 s}

arrivals:
  orders: {dist: exponential, rate: 0.4, spawn: pack_order}

tasks:
  pack_order:
    service: packing
    resource: packers
    payload: {event_type: order_packed}

egress:
  - type: Console

run:
  until: 1 min
