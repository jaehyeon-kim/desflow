# The Model Breakdowns guide: a station that fails after 5 seconds of work, not after
# 5 seconds of time. One order arrives at 10 seconds and takes 8. Run it with:
# desflow run breakdowns_busy.yaml --stdout
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

# --8<-- [start:busy]
resources:
  station:
    current_cap: 1
    breakdown:
      time_to_failure: {dist: constant, value: 5}
      repair: {dist: constant, value: 2}
      work: finish
      # Count the time to failure only while a unit is in use. The default, calendar,
      # counts it from the start or the last repair, busy or idle.
      clock: busy
# --8<-- [end:busy]

services:
  packing: {dist: constant, value: 8}

arrivals:
  orders: {dist: constant, value: 10, first_at: 10, max_events: 1, spawn: pack}

tasks:
  pack:
    resource: station
    service: packing
    payload: {event_type: packed}

run: {until: 30}
