# The Wait for One or All guide: an order waits for a restock or 30 seconds. The
# order and the restock are replayed from orders.csv and restocks.csv, which
# first_yaml() in wait_for_one_or_all.py writes beside this blueprint.
# --8<-- [start:first]
simulation: {sim_id: Shop, factor: 0}

signals: [restocked]

arrivals:
  orders:
    replay: {path: orders.csv}
    spawn: order
  restocks:
    replay: {path: restocks.csv}
    spawn: restock

tasks:
  order:
    wait:
      any:
        stock: {signal: restocked}
        limit: {timeout: 30}
    # wait.<branch>.done is true for each branch that was done when the wait ended
    payload:
      event_type: resumed
      done:
        stock: {gen: expr, expr: wait.stock.done}
        limit: {gen: expr, expr: wait.limit.done}
  restock:
    signal: restocked
    payload: {boxes: 6}

run: {until: 60}
# --8<-- [end:first]
