# The tasks and processes of the Tasks and Processes page, as a blueprint.
# Run it with: desflow run tasks.yaml
simulation: {sim_id: Shop, factor: 0, random_seed: 1}

egress:
  - {type: Console}

resources:
  packers: {current_cap: 1, max_cap: 3}

services:
  packing: {dist: normal, mean: 4 s, std: 1 s}
  labelling: {dist: constant, value: 2 s}

# --8<-- [start:arrival]
arrivals:
  # Each arrival spawns one pack_order, and one return_logged
  # An order every 5 s on average (rate 0.2)
  orders: {dist: exponential, rate: 0.2, spawn: pack_order}
  # A return every 10 s on average (rate 0.1)
  returns: {dist: exponential, rate: 0.1, spawn: return_logged}
# --8<-- [end:arrival]
# --8<-- [start:break-arrival]
  # One entity exists when the run starts and drives the breaks
  shifts: {initial: 1, spawn: take_break}
# --8<-- [end:break-arrival]

# --8<-- [start:task]
tasks:
  pack_order:
    service: packing  # how long the work takes
    resource: packers  # what it holds while it works
    payload: {event_type: order_packed}  # the finished event's value
    next: print_label  # the task that follows; Task Flow has the other forms
  return_logged:
    # No service and no resource: publishes its payload at once
    payload: {event_type: return_logged}
# --8<-- [end:task]
  # --8<-- [start:timed-step]
  print_label:
    # A service and no resource: a timed step that starts at once
    service: labelling
    payload: {event_type: label_printed}
  # --8<-- [end:timed-step]
  # --8<-- [start:payload-mapping]
  # A payload with generated fields: nine orders in ten are standard, one is express
  pack_with_delivery:
    service: packing
    resource: packers
    payload:
      event_type: order_packed
      delivery:
        gen: weighted
        options: {standard: 0.9, express: 0.1}
  # --8<-- [end:payload-mapping]
  # --8<-- [start:break]
  # The packers go on a 5-second break every 50 seconds: wait, set the capacity with
  # on:, and hand over to the other task, which sets it back
  take_break:
    wait: {timeout: 50 s}
    on:
      - {path: Shop.resources.packers.current_cap, value: 0}
    payload: {event_type: break_started}
    next: end_break
  end_break:
    wait: {timeout: 5 s}
    on:
      - {path: Shop.resources.packers.current_cap, value: 1}
    payload: {event_type: break_ended}
    next: take_break
  # --8<-- [end:break]

run: {until: 3 min}
