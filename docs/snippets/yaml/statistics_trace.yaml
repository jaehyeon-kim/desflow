# The event trace: one record for each event the environment processes.
# Run it with: desflow run statistics_trace.yaml
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

# --8<-- [start:trace]
egress:
  # Only a sink with when: trace receives the trace records
  - {type: Console, when: trace}

# With only trace set, the level is none
stats: {trace: true}
# --8<-- [end:trace]

resources:
  packers: {current_cap: 2, max_cap: 5}

services:
  packing: {dist: gamma, shape: 4, scale: 0.75 s}

arrivals:
  orders: {dist: exponential, rate: 0.6, spawn: pack_order}

tasks:
  pack_order:
    service: packing
    resource: packers
    payload: {event_type: order_packed}

run: {until: 10}
