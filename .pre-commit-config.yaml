repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The draw.io app saves diagrams without a trailing newline, so every edit to
      # the architecture diagram failed these two hooks in CI. tests/copied_projects
      # holds other projects' files unchanged, among them CRLF data files.
      - id: trailing-whitespace
        exclude: \.drawio$|^tests/copied_projects/
      - id: end-of-file-fixer
        exclude: \.drawio$|^tests/copied_projects/
      - id: check-yaml
        # The YAML examples use the !python tag, which a safe load rejects. --unsafe
        # checks syntax only, without constructing the tags.
        args: [--unsafe]
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    # Must match the yamllint floor in pyproject.toml dev dependencies.
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
        files: ^(tests/known_cases/[^/]+/model\.yaml|examples/.*\.yaml|docs/snippets/.*\.yaml)$

  - repo: local
    hooks:
      - id: blueprint-layout
        name: blueprint layout
        language: python
        # Must match the ruamel.yaml floor in the dev dependencies, and PyYAML's in the
        # package dependencies.
        additional_dependencies: [ruamel.yaml==0.19.1, pyyaml==6.0.1]
        entry: python scripts/blueprint_layout.py --check
        files: ^(tests/known_cases/[^/]+/model\.yaml|examples/.*\.yaml|docs/snippets/.*\.yaml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff floor in pyproject.toml dev dependencies. When the two
    # disagree, whichever formatter ran last wins and the diff flaps.
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Must match the mypy floor in pyproject.toml dev dependencies, for the same reason.
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [types-orjson, "redis>=5.0.1", types-PyYAML]
        args: [--ignore-missing-imports]
        # The examples are scripts run by path, not an importable package, so they
        # carry no __init__.py. mypy then sees examples/builder/parquet_example.py
        # and examples/low-level/parquet_example.py as two modules with the same
        # name and refuses to check anything. Type checking is for the library.
        # `_pb2.py` modules are generated by protoc, as
        # docs/snippets/guides/shop_record_pb2.py is.
        #
        # The folders of tests/known_cases hold programs written as SimPy's own tests and
        # guides write them (untyped lists and dicts, functions that carry a flag as an
        # attribute), so they are not checked. The files beside them are.
        #
        # skills/desflow/ is written by scripts/gen_skill.py, so its
        # scripts/check_model.py is a copy of scripts/skill/scripts/check_model.py,
        # and two modules named check_model stop mypy in the same way.
        #
        # tests/copied_projects holds other projects' files, copied unchanged.
        exclude: ^examples/|_pb2\.py$|^tests/known_cases/[a-z0-9_]+/|^skills/|^tests/copied_projects/
