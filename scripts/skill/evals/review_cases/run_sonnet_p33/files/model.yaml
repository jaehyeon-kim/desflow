simulation: {sim_id: P, random_seed: 42, factor: 0}
egress:
  - {type: Console, config: {format: json}}
resources:
  # max_cap 3 so that the capacity can be raised to 3
  m: {current_cap: 1, max_cap: 3}
services:
  hold: {dist: constant, value: 5}
arrivals:
  a: {first_at: 0, gap: 1, max_events: 2, spawn: job}
  boss: {first_at: 2, gap: 1, max_events: 1, spawn: grow}
tasks:
  job:
    resource: m
    service: hold
    payload: {event_type: done}
  grow:
    payload: {event_type: grow}
    on:
      - {path: P.resources.m.current_cap, value: 3}
run: {until: 20}
