# Shop: orders arrive every 2 seconds from time 2 and each is packed by one of
# one packer for 1.5 seconds. A Console sink prints only the order_packed events,
# one JSON line each. The start time is fixed so the timestamps repeat.
#
# Run it from this folder with: desflow run model.yaml

simulation:
  sim_id: Shop
  factor: 0
  random_seed: 42
  logical_start_time: "2026-01-01T00:00:00+00:00"

egress:
  - type: Console
    config: {format: json}
    when: {expr: "record.value.event_type == 'order_packed'"}

resources:
  packers: {current_cap: 1}

services:
  pack: {dist: constant, value: 1.5}

arrivals:
  # One order every 2 seconds, the first at time 2.
  orders: {dist: constant, value: 2, first_at: 2, spawn: pack_order}

tasks:
  pack_order:
    service: pack
    resource: packers
    payload: {event_type: order_packed}

run: {until: 20}
