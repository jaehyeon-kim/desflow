# Shop: orders arrive every 2 s from t=2, one packer, 1.5 s to pack.
# The Console sink prints only the order_packed records (queued, started and
# telemetry are filtered out by the sink's `when`).
simulation: {sim_id: Shop, factor: 0, random_seed: 42}

egress:
  - type: Console
    config: {format: json}
    when: {expr: "record.value.event_type == 'order_packed'"}

resources:
  packers: {current_cap: 1}

services:
  packing: {dist: constant, value: 1.5}

arrivals:
  orders: {gap: 2, first_at: 2, spawn: pack_order}

tasks:
  pack_order:
    service: packing
    resource: packers
    payload: {event_type: order_packed}

run: {until: 20}
