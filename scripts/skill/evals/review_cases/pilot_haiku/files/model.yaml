# Set_capacity from a flow: two jobs share resource m, which has capacity 1.
# At 2 seconds the boss task raises the capacity of m to 3 through a registry path.
# The run ends at 20 simulation seconds.
#
# Run it from its folder with: desflow run model.yaml

simulation: {sim_id: P, factor: 0, random_seed: 42}

egress:
  - {type: Console}

resources:
  m: {current_cap: 1, max_cap: 3}

arrivals:
  # One entity at 0 s, then one each second: two entities in all, each running job.
  a: {gap: 1, first_at: 0, max_events: 2, spawn: job}
  # One entity at 2 s, once, running grow.
  boss: {gap: 1, first_at: 2, max_events: 1, spawn: grow}

tasks:
  job:
    resource: m
    service_time: 5
    payload: {event_type: done}
  grow:
    payload: {event_type: grow}
    on:
      - {path: P.resources.m.current_cap, value: 3}

run: {until: 20}
