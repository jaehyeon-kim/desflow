simulation: {sim_id: P, factor: 0, random_seed: 42}

egress:
  - {type: Console, config: {format: json}}

resources:
  # max_cap is 3 so that grow can raise current_cap to 3
  m: {current_cap: 1, max_cap: 3}

services:
  hold: {dist: constant, value: 5}

arrivals:
  a: {dist: constant, value: 1, first_at: 0, max_events: 2, spawn: job}
  boss: {dist: constant, value: 1, first_at: 2, max_events: 1, spawn: grow}

tasks:
  job:
    service: hold
    resource: m
    payload: {event_type: done}
  grow:
    payload: {event_type: grow}
    on:
      - {path: P.resources.m.current_cap, value: 3}

run:
  until: 20
  before: [!python os.getcwd]
