# Three changes to the YAML an agent writes for task DS-V10: a rate, a weight or share,
# a capacity, or the nearest time or count, or, where no number the request names
# changes the records, one step of the flow. Each change tries the keys of `keys` that
# exist in model.yaml, in order, and keeps the first that alters the records (grade.py).

task: DS-V10

mutations:
  - name: w of a 1 to 0.5
    changes:
      - {keys: [arrivals.a.attributes.w], new: 0.5}
  - name: w of b 0.5 to 1
    changes:
      - {keys: [arrivals.b.attributes.w], new: 1}
  - name: gap of b 1 to 2
    changes:
      - {keys: [arrivals.b.value, arrivals.b.gap, arrivals.b.gap.value], new: 2}
