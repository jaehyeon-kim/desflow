# Three changes to the YAML an agent writes for task ST-RT2: a rate, a weight or share,
# a capacity, or the nearest time or count, or, where no number the request names
# changes the records, one step of the flow. Each change tries the keys of `keys` that
# exist in model.yaml, in order, and keeps the first that alters the records (grade.py).

task: ST-RT2

mutations:
  - name: three entities
    changes:
      - {keys: [arrivals.a.initial, arrivals.a.count, arrivals.a.max_events], new: 3}
  - name: tick every 2 seconds
    changes:
      - keys: [tasks.pem.service_time, "services.{tasks.pem.service}.value",
               tasks.pem.wait.timeout]
        new: 2
  - name: end 4 to 5
    changes:
      - {keys: [run.segments.1.until, run.until], new: 5}
