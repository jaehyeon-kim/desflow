  - name: tick 3 at 3
    match: {task: tick, value.event_type: log, value.priority: P3, value.item: '#0002'}
    at: 3
  - name: tick 4 at 4
    match: {task: tick, value.event_type: log, value.priority: P1, value.item: '#0003'}
    at: 4
  - name: take P0 at 3
    match:
      task: take
      value.event_type: repair
      value.priority: P0
      value.item: '#0001'
    at: 3
  - name: take P1 at 6
    match:
      task: take
      value.event_type: repair
      value.priority: P1
      value.item: '#0003'
    at: 6
  - name: take P2 at 9
    match:
      task: take
      value.event_type: repair
      value.priority: P2
      value.item: '#0000'
    at: 9
  - name: take P3 at 12
    match:
      task: take
      value.event_type: repair
      value.priority: P3
      value.item: '#0002'
    at: 12
