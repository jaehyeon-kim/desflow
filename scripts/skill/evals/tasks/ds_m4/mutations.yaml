# Three changes to the YAML an agent writes for task DS-M4: a rate, a weight or share, a
# capacity, or the nearest time or count, or, where no number the request names changes
# the records, one step of the flow. Each change tries the keys of `keys` that exist in
# model.yaml, in order, and keeps the first that alters the records (grade.py).

task: DS-M4

mutations:
  - name: 4 cars at once to 3
    changes:
      - keys:
          - arrivals.cars.initial
          - arrivals.cars.count
          - arrivals.cars.max_events
        new: 3
  - name: car gap 5 to 6
    changes:
      - keys: [arrivals.cars.value, arrivals.cars.gap, arrivals.cars.gap.value]
        new: 6
  - name: car step 5 to 4
    changes:
      - keys: [tasks.car_on.service_time, "services.{tasks.car_on.service}.value",
               tasks.car_on.wait.timeout]
        new: 4
