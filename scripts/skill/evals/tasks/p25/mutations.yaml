# Three changes to the YAML an agent writes for task P25: a rate, a weight or share, a
# capacity, or the nearest time or count, or, where no number the request names changes
# the records, one step of the flow. Each change tries the keys of `keys` that exist in
# model.yaml, in order, and keeps the first that alters the records (grade.py).

task: P25

mutations:
  - name: rework weight 1 to 0
    changes:
      - {keys: [tasks.check.next.weights.make], new: 0}
  - name: pass weight 4 to 1
    changes:
      - {keys: [tasks.check.next.weights.pass], new: 1}
  - name: gap 2 to 4
    changes:
      - {keys: [arrivals.a.value, arrivals.a.gap, arrivals.a.gap.value], new: 4}
