[project]
name = "desflow"
version = "0.26.0"
description = "Realistic event streams from a SimPy simulation you can steer while it runs, written to Kafka, Redis, PostgreSQL, Parquet, JSONL and Iceberg."
readme = "README.md"
authors = [
    { name = "Jaehyeon Kim", email = "dottami@gmail.com" }
]
keywords = [
    "simpy",
    "simulation",
    "digital-twin",
    "discrete-event-simulation",
    "kafka",
    "redis",
    "postgres",
    "real-time",
    "industry-4-0",
    "yaml",
    "iceberg",
    "parquet"
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "simpy>=4.1.2",
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    # 2.6.0 is the oldest release the unit and conformance tests pass with: 2.0 to
    # 2.4 have no Discriminator, and 2.5 no inf_nan_mode in to_jsonable_python
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "typer>=0.16.0"
]

[project.scripts]
desflow = "desflow.cli:app"
# The command before the rename. It warns, then runs desflow.
ddes = "desflow.blueprint.cli:ddes"

[project.urls]
Homepage = "https://jaehyeon.me/desflow/"
Repository = "https://github.com/jaehyeon-kim/desflow"
Documentation = "https://jaehyeon.me/desflow/"
Issues = "https://github.com/jaehyeon-kim/desflow/issues"

[project.optional-dependencies]
kafka = [
    # lz4 because KafkaEgress compresses with lz4 by default.
    "aiokafka[lz4]>=0.11.0",
]
redis = ["redis>=5.0.1"]
postgres = ["asyncpg>=0.29.0"]
confluent = [
    # ConfluentAvroSerializer lives in the Kafka connector module, so the kafka
    # extra is required for `pip install desflow[confluent]` to be usable.
    "desflow[kafka]",
    # desflow writes the Confluent wire format itself: fastavro for Avro binary,
    # httpx for the registry's REST API. fastavro 1.13.0 is the first release
    # with wheels for every supported Python, 3.11 to 3.15. httpx 0.26.0 added
    # the proxy argument.
    "fastavro>=1.13.0",
    "httpx>=0.26.0",
    # build_ssl_context reads its CA bundle for the default check, as httpx does,
    # and httpx already installs it.
    "certifi",
    # The JSON Schema classes check records as confluent-kafka does. 4.18.0 is the
    # first release with `referencing`, which the schema references use.
    "jsonschema>=4.18.0",
    # The Protobuf classes. 5.27.0 is the oldest release whose unit tests pass on
    # Python 3.11 and 3.14. 5.26.0 passes on 3.11, and on 3.14 fails on import of
    # its C module (`Metaclasses with custom tp_new are not supported`).
    "protobuf>=5.27.0",
]
glue = [
    # The Glue classes live in the Kafka connector modules.
    "desflow[kafka]",
    # boto3 before 1.26.0 pulls a botocore that imports cgi, which Python 3.13
    # removed.
    "boto3>=1.26.0",
    # fastavro as for the confluent extra.
    "fastavro>=1.13.0",
    # The Glue JSON reader compiles a schema version with fastjsonschema, as
    # aws-glue-schema-registry 1.1.3 did. 2.22.1 is the oldest release it was
    # checked against 1.1.3 with; 2.22.0 is yanked.
    "fastjsonschema>=2.22.1",
    # The Glue Protobuf classes. The floor is as for the confluent extra.
    "protobuf>=5.27.0",
]
parquet = [
    # 16.0.0 is the first release with AzureFileSystem, which the `azure` filesystem
    # type builds (python/pyarrow/_azurefs.pyx is absent at the apache-arrow-15.0.0
    # tag and present at apache-arrow-16.0.0). The floor covers `account_key` and
    # Azure's default credentials; `sas_token` needs pyarrow 20.0.0 and `client_id`,
    # `client_secret` and `tenant_id` need 21.0.0 (python/pyarrow/_azurefs.pyx at
    # apache-arrow-19.0.0, 20.0.0 and 21.0.0). PyPI's Windows wheels include it only
    # from 24.0.0. The floor is checked with
    # `uv run --all-extras --with pyarrow==16.0.0 python -m pytest tests/integration -m azure`
    # and the same for `-m gcp`.
    "pyarrow>=16.0.0"
]
iceberg = [
    # pyiceberg reads and writes through pyarrow, and its own pyarrow extra is what
    # pins a compatible pair. Writing is not possible without it.
    #
    # 0.7.0 is the oldest release the integration tests pass against, so it is the
    # floor. Everything the connector calls has been there since then. A newer
    # pin elsewhere still resolves: odctl's airflow image asks for 0.11.1, and on
    # Python 3.13 or later only 0.11.0 and above are installable anyway.
    #
    # pyiceberg's sql-postgres extra (SQLAlchemy and psycopg2-binary) serves the
    # SQL catalogs on SQLite and PostgreSQL, and its glue extra (boto3) the Glue
    # catalog, so one install gives every catalog the connector is tested against.
    # Both extras exist from 0.7.0.
    "pyiceberg[pyarrow,sql-postgres,glue]>=0.7.0"
]
fit = [
    "matplotlib>=3.11.2",
    "scipy>=1.17.1",
]
all = [
    "desflow[kafka,redis,postgres,confluent,glue,parquet,iceberg,fit]"
]
[build-system]
requires = ["uv_build>=0.9.16,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# dynamic_des is the import name before the rename. It warns and loads desflow, so
# code written for dynamic-des keeps running until it is removed in a later release.
module-name = ["desflow", "dynamic_des"]

[dependency-groups]
dev = [
    "mkdocs<2.0",
    "mkdocs-material>=9.7.4",
    "mkdocstrings[python]>=1.0.8",
    "mike>=2.1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    # Runs the tests in parallel worker processes (-n auto in CI).
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.5",
    # Integration tests and the examples get their containers from odctl. 1.x
    # keeps profile names, ports and commands stable, and versions before 0.5.1
    # created the Valkey user without a channel grant (odctl#76).
    "odctl>=1.0,<2",
    "pytest-cov>=5.0.0",
    "types-redis>=4.6.0",
    "types-pyyaml>=6.0.12",
    "mkdocs-llmstxt>=0.5.1",
    # 1.2.3 adds properdocs, a second documentation tool with its own command.
    "mkdocs-redirects==1.2.2",
    # The roadmap page draws its releases as a timeline.
    "neoteroi-mkdocs>=1.2.0",
    # scripts/charts.py draws the tutorial answers and the distribution shapes.
    "matplotlib>=3.11.2",
    # Builds the generated Reference pages. 0.6.1 adds properdocs, as
    # mkdocs-redirects 1.2.3 does.
    "mkdocs-gen-files==0.6.1",
    "jsonschema>=4.26.0",
    # scripts/charts.py animates a run for the Animate a Run page.
    "vidigi>=2.0.0",
    # The Avro and Pydantic guide generates its schema from a Pydantic model with
    # it; desflow's own code does not import it. Every release before 0.71.1 fails
    # that guide's test on Python 3.15 (`module 'dataclasses' has no attribute
    # '_MISSING_TYPE'`), and 0.71.1 passes on 3.11, 3.12 and 3.15.
    "dataclasses-avroschema[pydantic]>=0.71.1",
]

[tool.ruff]
# Generated by protoc, as docs/snippets/guides/shop_record_pb2.py and its .pyi file are.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.pytest.ini_options]
# docs/snippets holds a reader's test_a_model.py, which a run of the suite must not collect
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Docker infrastructure (deselect with '-m \"not integration\"')",
    "services: integration tests that use the odctl kafka-lite, postgres and valkey profiles",
    "storage: integration tests that use the odctl storage and catalog profiles (SeaweedFS, the Iceberg REST catalog and its PostgreSQL)",
    "floci: integration tests that start a Floci container (AWS emulator: S3 and Glue)",
    "azure: integration tests that start an Azurite container (Azure Blob Storage emulator)",
    "gcp: integration tests that start a fake-gcs-server container (Google Cloud Storage emulator)",
]
