# case ST-I07: test_immediate_interrupt: the parent creates a child that waits on a bare event and interrupts it at once; the child is interrupted at time 0.
simulation: {sim_id: T, factor: 0, random_seed: 42}
signals: {never: {once: true}}
arrivals: {parent: {initial: 1, spawn: parent}}
tasks:
  parent: {spawn: {task: child}, payload: {event_type: parent}, next: stop}
  stop: {payload: {event_type: interrupt}, interrupt: {task: child}}
  child: {wait: {signal: never}, on_interrupt: abandon, on_interrupt_next: caught, payload: {event_type: finished}}
  caught: {payload: {event_type: interrupted, at: {gen: expr, expr: t}}}
