# EX-6 Event latency (SimPy docs/examples/code/latency.py). A sender puts a message every 5; each message reaches the store after 10.
simulation: {sim_id: Latency, factor: 0, random_seed: 42}
stores: {cable: {}}
arrivals: {sender: {dist: constant, value: 5, spawn: send}, receiver: {initial: 1, spawn: receive}}
tasks:
  send:
    payload: {event_type: sent}
    spawn: {task: latency, args: {msg: {gen: format, template: "Sender sent this at {now:g}", names: {now: {gen: expr, expr: t}}}}}
  latency: {service_time: 10, put: {store: cable, item: {gen: expr, expr: "arg.msg"}}, payload: {event_type: delivered}}
  receive: {get: {store: cable}, payload: {event_type: received, msg: {gen: expr, expr: item}}, next: receive}
run: {until: 100}
