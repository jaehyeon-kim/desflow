# DX-23: Kafka sinks on a TLS connection and on Amazon MSK with IAM. docs/how-to/records-and-kafka/kafka-security.md builds the SSL context with `aiokafka.helpers.create_ssl_context` and the token provider with `aws_msk_iam_sasl_signer` and passes `ssl_context` and `sasl_oauth_token_provider`; here `ssl` gives the arguments, with the certificate files named by variables, and `sasl_oauth_token_provider` names the type and the region. The sinks are taken away for the run, and `check` compares the context and the provider with the guide's. The test writes a CA and a key pair and a stand-in for `aws_msk_iam_sasl_signer`.
simulation: {sim_id: Shop, factor: 0, random_seed: 42, logical_start_time: "2026-01-01T00:00:00+00:00", timezone: UTC}
resources: {packers: {current_cap: 1, max_cap: 1}}
services: {packing: {dist: constant, value: 1.5}}
arrivals: {orders: {dist: constant, value: 2, spawn: pack_order}}
tasks:
  pack_order:
    service: packing
    resource: packers
    payload: {event_type: order_packed}
egress:
  - type: Kafka
    config:
      bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9093}
      security_protocol: SSL
      ssl:
        cafile: ${KAFKA_CA_FILE}
        certfile: ${KAFKA_CERT_FILE}
        keyfile: ${KAFKA_KEY_FILE}
        password: "${KAFKA_KEY_PASSWORD:-changeit}"
  - type: Kafka
    config:
      bootstrap_servers: b-1.my-msk.amazonaws.com:9098
      security_protocol: SASL_SSL
      sasl_mechanism: OAUTHBEARER
      sasl_oauth_token_provider: {type: aws_msk_iam, region: us-east-1}
run: {until: 20}
