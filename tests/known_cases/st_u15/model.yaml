tasks:
  pem: {wait: {any: {a: {timeout: {after: 2, value: a}}, b: {timeout: {after: 1, value: b}}}}, payload: {event_type: done, at: {gen: expr, expr: t}, values: [{gen: expr, expr: "wait.b.value"}]}}
