# case CV-087: Store.items.remove(x): a get with a filter and no wait.
simulation: {sim_id: C, factor: 0, random_seed: 42}

stores:
  q: {items: [a, b]}

arrivals:
  a: {initial: 1, spawn: take}

tasks:
  take:
    get: {store: q, filter: "item == 'b'", wait: false}
    payload: {event_type: removed}
