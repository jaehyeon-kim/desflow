# case P47: round robin (register audit2/patterns/mine/g_c.py P47: the k-th arrival goes
# to q((k - 1) % 3 + 1), entities at one instant).
simulation: {sim_id: P, factor: 0, random_seed: 42}

signals:
  rr: {once: false}

arrivals:
  a: {initial: 3, spawn: route}

tasks:
  route:
    signal: rr
    payload: {event_type: dealt}
    next:
      when:
        - {condition: "signal.rr.count % 3 == 1", task: q1}
        - {condition: "signal.rr.count % 3 == 2", task: q2}
      default: q3
  q1:
    payload: {event_type: q1}
  q2:
    payload: {event_type: q2}
  q3:
    payload: {event_type: q3}
