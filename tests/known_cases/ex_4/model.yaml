# Fixed draws: the original draws the gap (expovariate), the movie (choice) and the number of tickets (randint(1, 6)). Here the gap is 0.5, the movie is picked by the arrival number, and the tickets are 1 + (n * 5) % 6, the same values as in programs/known11.py.
# EX-4 Movie renege (SimPy docs/examples/code/movie_renege.py). One counter, three movies with 50 tickets each, a sold-out event per movie that makes waiting moviegoers leave.
simulation: {sim_id: Theater, factor: 0, random_seed: 42}
variables:
  available: {Python Unchained: 50, Kill Process: 50, Pulp Implementation: 50}
  when_sold_out: {}
  num_renegers: {Python Unchained: 0, Kill Process: 0, Pulp Implementation: 0}
resources: {counter: {current_cap: 1}}
signals: {sold_out: {family: true, once: true}}
arrivals:
  goers:
    dist: constant
    value: 0.5
    spawn: moviegoer
    attributes:
      n: {gen: sequence, start: 0}
      movie: {gen: expr, expr: "['Python Unchained', 'Kill Process', 'Pulp Implementation'][(attr.n * 7) % 3 if attr.n % 5 else 0]"}
      tickets: {gen: expr, expr: "1 + (attr.n * 5) % 6"}
tasks:
  moviegoer:
    balk: "registry['Theater.variables.available'][attr.movie] == 0"
    open: {slot: {request: counter}}
    wait: {any: {turn: {handle: slot}, out: {signal: {of: sold_out, key: "attr.movie"}}}}
    payload: {event_type: at_counter}
    next: {when: [{condition: "wait.turn.done", task: serve}], default: leave}
  leave:
    cancel: slot
    release: {handle: slot}
    payload: {event_type: reneged}
    on: [{path: Theater.variables.num_renegers, value: {gen: expr, expr: "set_key(registry['Theater.variables.num_renegers'], attr.movie, get_key(registry['Theater.variables.num_renegers'], attr.movie, 0) + 1)"}}]
  serve:
    payload: {event_type: served}
    next: {when: [{condition: "registry['Theater.variables.available'][attr.movie] < attr.tickets", task: argue}], default: buy}
  argue: {service_time: 0.5, payload: {event_type: argued}, release: {handle: slot}}
  buy:
    payload: {event_type: bought}
    on: [{path: Theater.variables.available, value: {gen: expr, expr: "set_key(registry['Theater.variables.available'], attr.movie, registry['Theater.variables.available'][attr.movie] - attr.tickets)"}}]
    next: check
  check: {payload: {event_type: checked}, next: {when: [{condition: "registry['Theater.variables.available'][attr.movie] < 2", task: sold}], default: finish}}
  sold:
    payload: {event_type: sold_out}
    on:
      - {fire: {signal: {of: sold_out, key: "attr.movie"}}}
      - {path: Theater.variables.when_sold_out, value: {gen: expr, expr: "set_key(registry['Theater.variables.when_sold_out'], attr.movie, t)"}}
      - {path: Theater.variables.available, value: {gen: expr, expr: "set_key(registry['Theater.variables.available'], attr.movie, 0)"}}
    next: finish
  finish: {service_time: 1, payload: {event_type: done}, release: {handle: slot}}
run: {until: 120}
