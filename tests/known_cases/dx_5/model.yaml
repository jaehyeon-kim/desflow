# DX-5: a payload that reads which branches of a wait were done. The snippet's `branches` (docs/snippets/yaml/wait_for_one_or_all_logic.py) builds the done map from the wait; here `gen: expr` reads `wait.<branch>.done`. An order waits for a restock or 30 seconds.
simulation: {sim_id: Shop, factor: 0}
signals: {restocked: {once: false}}
arrivals:
  orders: {replay: {path: orders.csv}, spawn: order}
  restocks: {replay: {path: restocks.csv}, spawn: restock}
tasks:
  order:
    wait:
      any:
        stock: {signal: restocked}
        limit: {timeout: 30}
    payload:
      event_type: resumed
      done:
        stock: {gen: expr, expr: wait.stock.done}
        limit: {gen: expr, expr: wait.limit.done}
  restock: {signal: restocked, payload: {boxes: 6}}
run: {until: 60}
