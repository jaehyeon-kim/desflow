# case ST-C04: test_operator_nested_and: (t0 & t2) | t1: the process continues at 1; t0
# and t1 are in the result, t2 is not.
simulation: {sim_id: T, factor: 0, random_seed: 42}

arrivals:
  a: {initial: 1, spawn: pem}

tasks:
  pem:
    wait:
      any:
        both:
          all:
            t0:
              timeout: {after: 0, value: 0}
            t2:
              timeout: {after: 2, value: 2}
        t1:
          timeout: {after: 1, value: 1}
    payload:
      event_type: done
      at: {gen: expr, expr: t}
      values:
        - {gen: expr, expr: "wait.t0.value"}
        - {gen: expr, expr: "wait.t1.value"}
      in_result: {gen: expr, expr: "[wait.t0.done, wait.t1.done, wait.t2.done]"}
