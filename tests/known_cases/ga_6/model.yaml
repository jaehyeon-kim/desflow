# GA-6: five sensors each drift from their previous value. Five sensors report once a
# second, each reading is the sensor's previous reading plus a uniform draw between -1
# and 1 (yaml-only.md Part 4).
simulation: {sim_id: Sensors, factor: 0, random_seed: 42}

arrivals:
  reading:
    dist: constant
    value: 1
    spawn: sensor_reading
    count: 5
    key: {gen: sequence, format: "sensor-{}"}

tasks:
  sensor_reading:
    payload:
      sensor_id: {gen: entity}
      value:
        gen: add
        args:
          - {gen: previous, path: value, default: 0}
          - {gen: uniform, low: -1, high: 1}

run: {until: 100}
