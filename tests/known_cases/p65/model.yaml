# case P65: suspend until resume (design I4, research/yaml-only/programs/I4.py).
simulation: {sim_id: P, factor: 0, random_seed: 42}

arrivals:
  parked: {initial: 3, spawn: park}
  waker: {dist: constant, value: 2, spawn: wake, max_events: 1}

tasks:
  park:
    wait: {suspend: true}
    payload: {event_type: woke}
  wake:
    payload: {event_type: wake}
    resume: {task: park}
