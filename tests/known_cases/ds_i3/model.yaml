# Design I3: a flow after an interrupt, then the time left (interrupt at 2, repair 5,
# work 10).
simulation: {sim_id: I3, factor: 0, random_seed: 42}

services:
  long: {dist: constant, value: 10}
  fix: {dist: constant, value: 5}

arrivals:
  jobs: {dist: constant, value: 1, spawn: work, max_events: 1, first_at: 0}
  breaker: {dist: constant, value: 2, spawn: hit, max_events: 1}

tasks:
  work:
    service: long
    on_interrupt: resume
    on_interrupt_run: repair
    payload: {event_type: done}
  repair:
    service: fix
    payload: {event_type: repaired}
  hit:
    payload: {event_type: hit}
    interrupt: {task: work, cause: x}
