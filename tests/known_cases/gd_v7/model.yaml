# case GD-V7: t1 | t2, t1 & t2, (e1 | e2) & e3, timeout values (events.rst:268-283).
simulation: {sim_id: V, factor: 0, random_seed: 42}

arrivals:
  a: {initial: 1, spawn: any_stage}

tasks:
  any_stage:
    wait:
      any:
        t1:
          timeout: {after: 1, value: spam}
        t2:
          timeout: {after: 2, value: eggs}
    payload:
      event_type: any_done
      first: {gen: expr, expr: "wait.t1.value"}
      second_missing: {gen: expr, expr: "not wait.t2.done"}
    next: all_stage
  all_stage:
    wait:
      all:
        t1:
          timeout: {after: 1, value: spam}
        t2:
          timeout: {after: 2, value: eggs}
    payload:
      event_type: all_done
      values:
        - {gen: expr, expr: "wait.t1.value"}
        - {gen: expr, expr: "wait.t2.value"}
    next: nest_stage
  nest_stage:
    wait:
      all:
        left:
          any:
            e1: {timeout: 0}
            e2: {timeout: 1}
        e3: {timeout: 2}
    payload:
      event_type: nest_done
      all_processed: {gen: expr, expr: "wait.e1.done and wait.e2.done and wait.e3.done"}
