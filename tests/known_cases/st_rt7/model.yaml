# case ST-RT7: run(until=event) on a paced environment, when the event never triggers
# and nothing is scheduled: RuntimeError.
simulation: {sim_id: T, factor: 0.1, random_seed: 42}

signals:
  never: {once: true}

arrivals:
  a: {initial: 1, spawn: pem}

tasks:
  pem:
    payload: {event_type: done}

run:
  stop: {signal: never}
