# EX-5 Gas station refuelling (SimPy docs/examples/code/gas_station_refuel.py). Two pumps share a 200 litre tank; a control task calls a tank truck below 25 percent.
simulation: {sim_id: Station, factor: 0, random_seed: 42}
resources: {pumps: {current_cap: 2}}
containers: {tank: {current_cap: 200, level: 200}}
arrivals:
  control: {initial: 1, spawn: control}
  cars: {gap: {gen: integer, bounds: [30, 300]}, spawn: car, key: {gen: sequence, format: "Car {}"}, attributes: {level: {gen: integer, bounds: [5, 25]}}}
tasks:
  car:
    resource: pumps
    get: {container: tank, amount: "50 - attr.level"}
    service_time: "(50 - attr.level) / 2"
    payload: {event_type: refueled, litres: {gen: expr, expr: "50 - attr.level"}}
  control:
    payload: {event_type: checked}
    next: {when: [{condition: "level.tank / 200 * 100 < 25", task: call_truck}], default: pause}
  call_truck: {payload: {event_type: truck_called}, next: await_truck}
  await_truck: {wait: {task: truck}, payload: {event_type: truck_returned}, next: pause}
  truck: {service_time: 300, put: {container: tank, amount: "200 - level.tank"}, payload: {event_type: truck_arrived, litres: {gen: expr, expr: "200 - level.tank"}}}
  pause: {service_time: 10, payload: {event_type: waited}, next: control}
run: {until: 1000}
