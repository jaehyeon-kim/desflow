# case CV-116: yield from a nested generator: shared tasks with a return address in set.
# research/yaml-only/programs/Y6.py yield_from([1, 2]): sub(d) waits d and returns d *
# 2; the total is 6 at 3.
simulation: {sim_id: C, factor: 0, random_seed: 42}

arrivals:
  a:
    initial: 1
    spawn: main
    attributes: {d: 1, total: 0}

tasks:
  main:
    set: {back: first_return}
    payload: {event_type: main}
    next: shared
  shared:
    service_time: "attr.d"
    set:
      total: {gen: expr, expr: "attr.total + attr.d * 2"}
    payload: {event_type: shared}
    next:
      when:
        - {condition: "attr.back == 'first_return'", task: first_return}
      default: second_return
  first_return:
    set: {back: second_return, d: 2}
    payload: {event_type: first_return}
    next: shared
  second_return:
    payload:
      event_type: second_return
      at: {gen: expr, expr: t}
      total: {gen: expr, expr: "attr.total"}
