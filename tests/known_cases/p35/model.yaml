# case P35: set_queue_size at run time (shared with design H8; register r7_res2.py P35
# values: queue limit 1, service 5, arrivals at 0, 1, 3 and 3.5, the limit becomes 3 at
# 2, run until 7).
simulation: {sim_id: P, factor: 0, random_seed: 42}

resources:
  m: {current_cap: 1, queue_limit: 1}

services:
  s: {dist: constant, value: 5}

arrivals:
  a:
    replay: {path: a.csv, time: time, unit: s}
    spawn: job

scenario:
  - {at: 2, path: P.resources.m.queue_limit, value: 3}

tasks:
  job:
    resource: m
    service: s
    payload: {event_type: done}

run: {until: 7}
