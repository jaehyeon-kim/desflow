# case ST-V08: test_condition_nested_callback_removal: run(until=a | (b & c)) with a already succeeded; the nested condition's callbacks are removed too.
simulation: {sim_id: T, factor: 0, random_seed: 42}
signals: {a: {once: true}, b: {once: true}, c: {once: true}}
arrivals: {m: {initial: 1, spawn: maker}}
tasks: {maker: {payload: {event_type: made}, on: [{fire: {signal: a}}]}}
run: {stop: {condition: "signal.a.count >= 1 or (signal.b.count >= 1 and signal.c.count >= 1)"}}
