# case P21: a branch by state: the variable `open` is set to 0 at 3.5, so the arrivals
# before it take `fast` and the later ones take `closed`.
simulation: {sim_id: P, factor: 0, random_seed: 42}

variables: {open: 1}

arrivals:
  a: {dist: constant, value: 1, spawn: route, max_events: 6}

tasks:
  route:
    payload: {event_type: route}
    next:
      when:
        - {condition: "registry['P.variables.open'] == 0", task: closed}
      default: fast
  fast:
    payload: {event_type: fast}
  closed:
    payload: {event_type: closed}

scenario:
  - {at: 3.5, path: P.variables.open, value: 0}
