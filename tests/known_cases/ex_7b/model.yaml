# Fixed draws: the original draws the gap (randint(6, 10)) and the handling time (randint(4, 8)). Here they are 8 and 6, the same values as in programs/known11.py. The message is the payload of the task before the put, which an opened put takes as its item, because a mapping given as `item` is data and its generators are not evaluated.
# EX-7b Process communication, broadcast part. One generator puts to every output pipe without waiting; two consumers each read their own pipe.
simulation: {sim_id: Pipe, factor: 0, random_seed: 42}
stores: {pipe: {family: true, members: 2}}
arrivals:
  generator: {gap: 8, spawn: speak}
  consumer_a: {initial: 1, spawn: listen, attributes: {idx: 0}}
  consumer_b: {initial: 1, spawn: listen, attributes: {idx: 1}}
tasks:
  speak:
    payload: {event_type: said, sent: {gen: expr, expr: t}, text: {gen: format, template: "Generator A says hello at {now:g}", names: {now: {gen: expr, expr: t}}}}
    next: send
  send:
    open: {sends: {each: "members(pipe)", branch: {put: {store: {of: pipe, key: "each.value"}}}}}
    payload: {event_type: sent}
  listen:
    get: {store: {of: pipe, key: "attr.idx"}}
    payload: {event_type: received, late: {gen: expr, expr: "item.sent < t"}, text: {gen: expr, expr: "item.text"}}
    next: busy
  busy: {service_time: 6, payload: {event_type: handled}, next: listen}
run: {until: 100}
