# case ST-X02: a failing child nobody waits for raises out of run().
simulation: {sim_id: T, factor: 0, random_seed: 42}
arrivals: {p: {initial: 1, spawn: parent}}
tasks:
  parent: {spawn: {task: child}, payload: {event_type: parent}, next: pause}
  pause: {service_time: 1, payload: {event_type: parent_done}}
  child: {fail: "True", fail_reason: Onoes!, payload: {event_type: child}}
run: {on_unhandled_failure: stop}
