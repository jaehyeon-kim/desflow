# DX-3: the same model with the snippet's own Python: `choose_delivery` of docs/snippets/yaml/shop_logic.py, as docs/snippets/yaml/tasks.yaml names it.
simulation: {sim_id: Shop, factor: 0, random_seed: 1}
resources: {packers: {current_cap: 1, max_cap: 3}}
arrivals: {orders: {dist: constant, value: 5, spawn: pack_order}}
tasks:
  pack_order:
    service_time: 2
    resource: packers
    payload: !python shop_logic.choose_delivery
run: {until: 6000}
