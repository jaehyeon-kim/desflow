# DX-3: a payload that draws the delivery. The snippet's `choose_delivery`
# (docs/snippets/yaml/shop_logic.py) draws it from the shared generator; here `gen:
# weighted` and `gen: expr` give the same fields.
simulation: {sim_id: Shop, factor: 0, random_seed: 1}

resources:
  packers: {current_cap: 1, max_cap: 3}

arrivals:
  orders: {dist: constant, value: 5, spawn: pack_order}

tasks:
  pack_order:
    service_time: 2
    resource: packers
    payload:
      status: finished
      order_id: {gen: expr, expr: process.instance}
      delivery:
        gen: weighted
        options: {standard: 0.9, express: 0.1}

run: {until: 6000}
