# Design V1: a service time computed per entity (gas pump fills for fuel / 2 seconds).
# Source: research/yaml-only/programs/V1.py run([("a", 2), ("b", 4)]), the tie at one
# instant; the zero, odd, negative and interrupt scenarios are not in this row.
simulation: {sim_id: V1, factor: 0, random_seed: 42}

resources:
  pump: {current_cap: 1}

arrivals:
  a:
    dist: constant
    value: 1
    spawn: car
    max_events: 1
    first_at: 0
    attributes: {fuel: 2}
  b:
    dist: constant
    value: 1
    spawn: car
    max_events: 1
    first_at: 0
    attributes: {fuel: 4}

tasks:
  car:
    resource: pump
    service_time: "attr.fuel / 2"
    payload:
      event_type: done
      fuel: {gen: attr, name: fuel}
