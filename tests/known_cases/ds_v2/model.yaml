# Design V2: a wait timeout computed per entity; a branch picks who wins. Source:
# research/yaml-only/programs/V2.py run(5, 1) (the event comes first) and run(1, 5) (the
# limit comes first), written as two independent waiter and sender pairs; the tie, zero
# and negative scenarios are not in this row. The limits are drawn, 3 to 7 where the
# event comes first and 1 to 3 where the limit comes first, so either draw gives the
# same winner; the comparison with the program fixes them to 5 and 1 (`DRAWS` of
# original.py).
simulation: {sim_id: V2, factor: 0, random_seed: 42}

signals:
  e1: {once: true}
  e2: {once: true}

arrivals:
  w1:
    dist: constant
    value: 1
    spawn: waiter
    max_events: 1
    first_at: 0
    attributes:
      limit: {gen: integer, bounds: [3, 7]}
  s1: {dist: constant, value: 1, spawn: send1, max_events: 1, first_at: 0}
  w2:
    dist: constant
    value: 1
    spawn: waiter2
    max_events: 1
    first_at: 0
    attributes:
      limit: {gen: integer, bounds: [1, 3]}
  s2: {dist: constant, value: 1, spawn: send2, max_events: 1, first_at: 0}

tasks:
  waiter:
    wait:
      any:
        ev: {signal: e1}
        limit: {timeout: "attr.limit"}
    payload:
      event_type: left
      ev: {gen: expr, expr: "wait.ev.done"}
      limit: {gen: expr, expr: "wait.limit.done"}
  waiter2:
    wait:
      any:
        ev: {signal: e2}
        limit: {timeout: "attr.limit"}
    payload:
      event_type: left
      ev: {gen: expr, expr: "wait.ev.done"}
      limit: {gen: expr, expr: "wait.limit.done"}
  send1:
    wait: {timeout: 1}
    payload: null
    on:
      - fire: {signal: e1, value: 1}
  send2:
    wait: {timeout: 5}
    payload: null
    on:
      - fire: {signal: e2, value: 1}
