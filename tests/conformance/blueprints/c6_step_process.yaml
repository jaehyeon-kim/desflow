# One model process waits 10 s again and again, with a resource, statistics every
# 10 s, and (added by the test) a sink and an ingress. See test_c6_end_conditions.py.
simulation:
  sim_id: C6
  factor: 0
resources:
  machine: {current_cap: 1, max_cap: 1}
stats: {level: basic, interval: 10}
processes:
  - !python tests.conformance.batch5_scripts.pinger
run:
  until: 40
