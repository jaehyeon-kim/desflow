# Pings every 10 s; the closing signal is due at 30, the same time as until,
# which ends the run first. See test_c6_end_conditions.py.
simulation:
  sim_id: C6
  factor: 0
signals: [closing]
arrivals:
  pings: {dist: constant, value: 10, spawn: ping}
  closings: {dist: constant, value: 30, spawn: close}
tasks:
  ping:
    payload: {event: ping}
  close:
    payload: {event: closed}
    signal: closing
run:
  until: 30
  stop: {signal: closing}
