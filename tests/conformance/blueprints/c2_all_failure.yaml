# An order at 10 waits for a restock and for its inspection; the restock at 12
# fails, so the order fails at 12 while its inspection runs on until 14.
# See test_c2_wait_for_one_or_all.py.
simulation:
  sim_id: C2
  factor: 0
signals: [restocked]
services:
  inspecting: {dist: constant, value: 4}
arrivals:
  orders: {dist: constant, value: 10, spawn: order}
  restocks: {dist: constant, value: 12, spawn: restock, attributes: {broken: 1}}
tasks:
  order:
    wait:
      all:
        stock: {signal: restocked}
        inspect: {task: inspect}
    payload: {event: resumed}
  inspect:
    service: inspecting
    payload: {grade: A}
  restock:
    payload: {qty: 3}
    signal: restocked
    fail: attr.broken == 1
    fail_reason: broken delivery
run:
  until: 16
