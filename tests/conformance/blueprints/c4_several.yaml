# Another task holds the bench from 9 for 20 s; an order at 10 acquires the picker,
# then waits for the bench while it holds the picker. See test_c4_resources.py.
simulation:
  sim_id: C4s
  factor: 0
resources:
  picker: {current_cap: 1, max_cap: 1}
  bench: {current_cap: 1, max_cap: 1}
services:
  long: {dist: constant, value: 20}
  work: {dist: constant, value: 5}
arrivals:
  others: {dist: constant, value: 9, spawn: other}
  orders: {dist: constant, value: 10, spawn: order}
tasks:
  other:
    service: long
    resource: bench
    payload: {event: other}
  order:
    service: work
    resource: [picker, bench]
    payload: {event: done}
run:
  until: 15
