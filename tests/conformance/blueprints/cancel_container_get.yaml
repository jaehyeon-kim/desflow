# A get waits from 10 with a patience of 2 and gives up at 12; a put at 14 stays in
# the container. See test_c5_inventory.py.
simulation:
  sim_id: C5c
  factor: 0
containers:
  bin: {current_cap: 4, max_cap: 4}
arrivals:
  takers: {dist: constant, value: 10, spawn: take}
  fillers: {dist: constant, value: 14, spawn: fill}
tasks:
  take:
    get: {container: bin, amount: 3}
    patience: 2
    payload: {event: taken}
  fill:
    put: {container: bin, amount: 2}
    payload: {event: filled}
run:
  until: 15
