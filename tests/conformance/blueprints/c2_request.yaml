# Two orders each wait for the one machine unit as a wait branch; the first holds it
# through its 5 s service, the second is served when it is freed. See test_c2_conditions.py.
simulation:
  sim_id: C2
  factor: 0
resources:
  m: {current_cap: 1, max_cap: 1}
services:
  work: {dist: constant, value: 5}
arrivals:
  orders: {replay: {path: c2_twice.csv}, spawn: order}
tasks:
  order:
    wait: {request: m}
    service: work
    payload: {event: done}
run:
  until: 20
