# The same model as resource_queue.yaml, with a capacity of infinity, so no job
# waits. See test_c4_resources.py.
simulation:
  sim_id: C4
  factor: 0
resources:
  machine: {current_cap: .inf}
services:
  work:
    dist: constant
    value: 5
arrivals:
  jobs:
    dist: constant
    value: 2
    spawn: work
tasks:
  work:
    service: work
    resource: machine
    payload:
      event_type: done
run:
  until: 13
