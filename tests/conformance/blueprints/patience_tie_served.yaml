# The holder's service ends at 16, scheduled at 10; the waiter's patience ends at
# 16, scheduled at 13, after it. SimPy serves the waiter.
simulation:
  sim_id: C7tie
  factor: 0
resources:
  machine: {current_cap: 1, max_cap: 1}
services:
  hold: {dist: constant, value: 6}
  quick: {dist: constant, value: 1}
arrivals:
  holders: {dist: constant, value: 10, spawn: holder}
  waiters: {dist: constant, value: 13, spawn: waiter}
tasks:
  holder:
    service: hold
    resource: machine
    payload: {event: held}
  waiter:
    service: quick
    resource: machine
    patience: 3
    payload: {event: served}
run:
  until: 18
