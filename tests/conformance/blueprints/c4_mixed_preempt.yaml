# A holder keeps a priority machine of 1 from 0 to 10; at 5 a request of priority
# 1 that does not preempt arrives, then one that may. See test_c4_resources.py.
simulation:
  sim_id: C4m
  factor: 0
resources:
  machine: {current_cap: 1, max_cap: 1, queue: priority}
services:
  hold: {dist: constant, value: 10}
  work: {dist: constant, value: 1}
arrivals:
  # One holder, at 0.001
  holders: {replay: {path: c4_mixed_holder.csv}, spawn: holder}
  plain: {dist: constant, value: 5, spawn: plain_job}
  eager: {dist: constant, value: 5, spawn: eager_job}
tasks:
  holder:
    service: hold
    resource: machine
    priority: 0
    payload: {event: held}
  plain_job:
    service: work
    resource: machine
    priority: 1
    preempt: false
    payload: {event: done}
  eager_job:
    service: work
    resource: machine
    priority: 1
    payload: {event: done}
run:
  until: 10.5
