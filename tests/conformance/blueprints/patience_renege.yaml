simulation:
  sim_id: C7
  factor: 0
resources:
  machine:
    current_cap: 1
    max_cap: 1
services:
  hold:
    dist: constant
    value: 10
  quick:
    dist: constant
    value: 1
arrivals:
  holders:
    dist: constant
    value: 1
    spawn: holder
  waiters:
    dist: constant
    value: 3
    spawn: waiter
tasks:
  holder:
    service: hold
    resource: machine
    payload:
      event: held
  waiter:
    service: quick
    resource: machine
    patience: 3
    payload:
      event: served
run:
  until: 7
