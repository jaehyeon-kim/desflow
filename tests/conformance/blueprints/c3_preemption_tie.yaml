# Users of priorities [1, 1] both get a preemptive machine of 2 at 10; a request
# of priority 0 arrives at 13. See test_c3_interrupts.py.
simulation:
  sim_id: C3
  factor: 0
resources:
  machine: {current_cap: 2, max_cap: 2, queue: priority, preempt: true}
services:
  long: {dist: constant, value: 10}
  short: {dist: constant, value: 5}
arrivals:
  low0: {dist: constant, value: 10.0, spawn: low, attributes: {p: 1}}
  low1: {dist: constant, value: 10.0, spawn: low, attributes: {p: 1}}
  high0: {dist: constant, value: 13, spawn: high, attributes: {p: 0}}
tasks:
  low:
    service: long
    resource: machine
    priority: attr.p
    payload: {event: low_done}
  high:
    service: short
    resource: machine
    priority: attr.p
    payload: {event: high_done}
run:
  until: 19.9
