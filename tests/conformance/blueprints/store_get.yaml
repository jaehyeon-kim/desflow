# A producer adds every 5 s and a consumer takes every 2 s from a store
# of 1; each waits as long as it must. See test_c5_bounded.py.
simulation:
  sim_id: C5
  factor: 0
stores:
  bin: {current_cap: 1, max_cap: 1}
arrivals:
  puts: {dist: constant, value: 5, spawn: put}
  gets: {dist: constant, value: 2, spawn: get}
tasks:
  put:
    put: {store: bin}
    payload: {event: put}
  get:
    get: {store: bin}
    payload: {event: get}
run:
  until: 21
