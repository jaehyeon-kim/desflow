# step reads process.name in its next rule, routing to same at 1. See
# test_c1_process_interaction.py.
simulation:
  sim_id: C1
  factor: 0
services:
  working: {dist: constant, value: 1}
tasks:
  step:
    service: working
    payload: {n: 1}
    next:
      when: [{condition: process.name == "step", task: same}]
      default: other
  same:
    payload: {event: same}
  other:
    payload: {event: other}
processes:
  - function: !python tests.conformance.batch2_scripts.start_task
    kwargs: {task: step, at: 0}
run:
  until: 3
