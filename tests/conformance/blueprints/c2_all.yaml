# An order at 10 waits for a restock and for its inspection; the inspection ends at
# 14 and the restock at 15, so the order resumes at 15.
# See test_c2_wait_for_one_or_all.py.
simulation:
  sim_id: C2
  factor: 0
signals: [restocked]
services:
  inspecting: {dist: constant, value: 4}
arrivals:
  orders: {dist: constant, value: 10, spawn: order}
  restocks: {dist: constant, value: 15, spawn: restock, attributes: {broken: 0}}
tasks:
  order:
    wait:
      all:
        stock: {signal: restocked}
        inspect: {task: inspect}
    payload: {event: resumed}
  inspect:
    service: inspecting
    payload: {grade: A}
  restock:
    payload: {qty: 3}
    signal: restocked
    fail: attr.broken == 1
    fail_reason: broken delivery
run:
  until: 16
