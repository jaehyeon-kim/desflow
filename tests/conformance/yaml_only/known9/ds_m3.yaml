# Design M3: a failed flow goes on (research/yaml-only/programs/M3.py run("event")). The breaker fails the signal with a `fail` condition, because the original uses `fire.fail`, a key of Batch 11.
simulation: {sim_id: M3, factor: 0, random_seed: 42}
signals: {may_fail: {once: true}}
arrivals:
  a: {dist: constant, value: 1, spawn: t, max_events: 1, first_at: 0}
  b: {dist: constant, value: 1, spawn: breaker, max_events: 1}
tasks:
  t: {wait: {signal: may_fail}, on_fail: handle, payload: {event_type: fine}}
  handle: {payload: {event_type: handled, reason: {gen: expr, expr: "upstream.reason"}, st: {gen: expr, expr: "upstream.status"}}}
  breaker: {fail: "True", fail_reason: event, signal: may_fail, on_fail: broke, payload: {event_type: break}}
  broke: {payload: {event_type: broke}}
