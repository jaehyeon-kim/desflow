# EX-1 Bank Renege, the port of SimPy 4.1.2 docs/examples/code/bank_renege.py: five
# customers arrive from time 0, about 10 seconds apart; each waits at the counter for
# 1 to 3 seconds and goes away if it is not served, and is served for about 12 seconds.
# The test compares it with the SimPy program with the draws fixed. See
# fixed_draws.py and test_yaml_only.py.
simulation: {sim_id: Bank, factor: 0, random_seed: 42}
resources: {counter: {current_cap: 1}}
arrivals:
  customers:
    dist: exponential
    rate: 0.1
    first_at: 0
    max_events: 5
    key: {gen: sequence, format: "Customer{:02d}"}
    spawn: customer
tasks:
  customer:
    resource: counter
    patience: {gen: uniform, low: 1, high: 3}
    service_time: {gen: sample, dist: exponential, rate: 0.08333333333333333}
    payload: {event_type: finished}
run: {until: 200}
