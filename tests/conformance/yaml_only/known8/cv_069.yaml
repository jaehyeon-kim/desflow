simulation: {sim_id: C, factor: 0, random_seed: 42}
resources: {m: {current_cap: 2}}
arrivals: {h: {initial: 2, spawn: take}, o: {initial: 2, spawn: watch}}
tasks:
  take: {seize: m, service_time: 1, payload: {event_type: held}, release: m, next: zero}
  zero: {wait: {timeout: 0}, payload: {event_type: after_release}}
