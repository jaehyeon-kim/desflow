# Fixed draws: the original draws the gap and the dirt removed at random. Here both are constants (a gap of 7 and 70 percent), the same values as in programs/known8.py.
# EX-2 Carwash (SimPy docs/examples/code/carwash.py). Four cars at time 0, then a car every 5 to 9 minutes (randint(5, 9)); a car keeps its machine while the wash child flow runs.
simulation: {sim_id: Carwash, factor: 0, random_seed: 42}
resources: {machine: {current_cap: 2}}
services: {wash: {dist: constant, value: 5}}
arrivals:
  cars: {initial: 4, gap: 7, spawn: car, key: {gen: sequence, format: "Car {}"}}
tasks:
  car: {seize: machine, payload: {event_type: enters}, next: washing}
  washing: {wait: {task: wash}, payload: {event_type: leaves}, release: machine}
  wash: {service: wash, payload: {event_type: washed, dirt_removed_pct: 70}}
run: {until: 20}
