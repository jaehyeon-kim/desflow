# V4: a value drawn for each entity when it starts, read by a priority. The program is
# programs/v4_draws.py. See test_yaml_only.py.
simulation: {sim_id: V4, factor: 0, random_seed: 42}
resources: {m: {current_cap: 1, queue: priority}}
services: {s: {dist: constant, value: 1}}
arrivals:
  a:
    replay: {path: a.csv}
    spawn: job
    attributes: {x: {gen: sample, dist: exponential, rate: 2}}
tasks:
  job: {resource: m, service: s, priority: "attr.x", payload: {event_type: done}}
run: {until: 30}
