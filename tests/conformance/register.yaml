  page: user-guide/tasks-and-processes/signals-and-waiting.md#wait-signals-and-child-flows
  differences: "By default (`on_unhandled_failure` is `stop`) a failure no task waits for stops the run, matching SimPy and the low-level API, where an exception nobody handles stops the run; under `on_unhandled_failure` of `continue` it ends the entity's flow in YAML and the builder, publishes `failed` and is counted, and the run goes on."

