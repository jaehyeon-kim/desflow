    - tests/conformance/test_c1_timed_wait.py::test_integer_literals_stay_integers
    - tests/conformance/test_builder_additions.py::test_builder_service_time
    - tests/conformance/test_builder_additions.py::test_builder_service_time_refuses_what_it_cannot_run
    - tests/conformance/test_yaml_only.py::test_v1_a_service_time_computed_for_each_entity_on_one_unit
