  page: user-guide/model-parts/stores-and-containers.md#take-and-add
  differences: "While a get with a filter waits, the store grants as SimPy's `FilterStore` does, looking at every waiting get each time. Once no filtered get waits, it grants one get per trigger, as `Store` does, where `FilterStore` goes on to the next. With filtered and unfiltered gets in one queue, gets at the same instant can therefore resume in a different order than in `FilterStore`; each get receives the same item."

