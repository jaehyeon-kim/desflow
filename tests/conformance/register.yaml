  page: guides/wait-for-one-or-all.md#wait-for-the-first
  differences: Losing signal, timeout and condition branches are dropped when the wait ends; losing child flows keep running, as SimPy leaves processes running.

- id: C2
  inventory: [SP-C2, SP-C4]
  operation: Wait for all events
