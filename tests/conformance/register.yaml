# Differences kept by design, approved by the owner on 18 Oct 2026.

- id: D
  inventory: [E11]
  status: difference
  operation: A run with no until
  simpy: "`core.Environment.run()` returns when no event is left"
  checks: []
  differences: "A run with a sink or an ingress connector and no `until` runs for ever, because a live run has no end: the connectors keep events coming. Give it an `until`, a `stop` or a `drain` to end it, or stop it with Ctrl+C."

- id: D
  inventory: [S3]
  status: difference
  operation: Capacity 0
  simpy: "`resources.resource.Resource(capacity=0)` raises `ValueError`, and so do `Store` and `Container`"
  checks: []
  differences: "A resource, store or container may have a capacity of 0, at the start or later, because its capacity changes during a run: a shift with no packers, a shelf that is closed. It grants nothing until the capacity rises."
