# The SimPy compatibility register: every SimPy operation desflow supports natively,
# its form in each API, the conformance tests that compare it with plain SimPy 4.1.1,
# and the docs page that teaches it. scripts/gen_pages.py writes the SimPy
# Compatibility page from this file, and tests/docs/test_gen_pages.py checks that
# every check names a test function, every test function here is listed, and every
# page exists.
#
# id: the capability group (C1 to C7 core, S1 to S3 bounded support)
# operation: what a model does
# simpy: the SimPy construct it corresponds to
# yaml, builder, low_level: one short form each
# checks: pytest node ids of the conformance tests
# page: the docs page and anchor that teaches it, relative to docs/
# differences: an intentional difference from SimPy, when there is one

- id: C1
  operation: Timed wait
  simpy: "`simpy.events.Timeout`"
  yaml: a task with `service` and no `resource`
  builder: "`@app.task(service_id=...)` with no resource"
  low_level: "`yield env.timeout(delay)`"
  checks:
    - tests/conformance/test_c1_timed_wait.py::test_c1_timed_wait
  page: user-guide/tasks-and-processes.md#a-timed-step

- id: C1
  operation: Signal event success and value
  simpy: "`simpy.events.Event.succeed(value)`"
  yaml: "`signals: [restocked]`, `signal: restocked` on the firing task and `wait: {signal: restocked}`"
  builder: "`add_signal`, `@app.task(signal=...)`, `wait={\"signal\": ...}`, or `context.signal(name).fire(value)`"
  low_level: "`Signal(env, name)`: `yield signal.wait()` and `signal.fire(value)`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_signal_event_success_and_value
    - tests/conformance/test_c1_process_interaction.py::test_c1_signal_waiter_after_a_firing_waits_for_the_next
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  operation: Signal event failure
  simpy: "`simpy.events.Event.fail(exception)`"
  yaml: "a failing task with `signal`; its waiters fail with its reason"
  builder: "the same, or `context.signal(name).fail(reason)`"
  low_level: "`signal.fail(reason)`; waiters receive `SignalFailed`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_signal_event_failure
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  operation: Start and wait for a process
  simpy: "`yield env.process(child())`"
  yaml: "`wait: {task: inspect}`"
  builder: "`wait={\"task\": \"inspect\"}`, or `yield context.call(\"inspect\")`"
  low_level: "`yield env.process(child())`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_start_and_wait_for_a_process
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  operation: Process return value
  simpy: "a process's `return` value"
  yaml: "`wait.inspect.value.<field>`, the last payload of the child flow"
  builder: "the same, or the value of `context.call(...)`"
  low_level: "`value = yield env.process(child())`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_return_value
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  operation: Process failure
  simpy: "an exception raised in a process reaches the process that waits for it"
  yaml: "`fail`, `fail_reason` and `on_fail` on a task; a failure no `on_fail` handles fails the waiting task"
  builder: "the same, and a function that raises fails its task"
  low_level: "`try: yield env.process(child())` and `except`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_failure
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_failure_handled_by_on_fail
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows
  differences: In YAML and the builder a failure no task waits for ends the entity's flow, publishes `failed` and is counted, and the run goes on; in SimPy, and in the low-level API, an exception nobody handles stops the run.

- id: C1
  operation: Event inspection
  simpy: "`Event.triggered`, `.processed`, `.ok`, `.value`"
  yaml: "`signal.<name>.count`, `.ok` and `.value` in a condition"
  builder: "`context.signal(name).wait()` and its SimPy attributes, or the signal's `count`, `ok` and `value`"
  low_level: "the same attributes of SimPy events and `Signal`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_event_inspection
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  operation: Process inspection
  simpy: "`Process.is_alive`, `.triggered`, `.ok`, `.value`"
  yaml: "`wait.<branch>.done`, `.ok` and `.value` after the wait"
  builder: "the process `context.spawn` and `context.call` return"
  low_level: "the process `env.process` returns"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_inspection
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  operation: Wait for a shared condition
  simpy: "a loop over a fresh \"changed\" event"
  yaml: "`wait: {condition: level.stock >= 5}`"
  builder: "`wait={\"condition\": \"level.stock >= 5\"}`"
  low_level: "`env.watch_changes(check)`, or a SimPy loop"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_wait_for_a_shared_condition
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C2
  operation: Wait for one event
  simpy: "`simpy.events.AnyOf`, `a | b`"
  yaml: "`wait: {any: {stock: {signal: restocked}, limit: {timeout: 3}}}`"
  builder: "`wait={\"any\": {...}}`"
  low_level: "`yield a | b`"
  checks:
    - tests/conformance/test_c2_wait_for_one_or_all.py::test_c2_wait_for_one_event
    - tests/conformance/test_c2_wait_for_one_or_all.py::test_c2_wait_for_one_event_two_at_one_instant
  page: guides/wait-for-one-or-all.md#wait-for-the-first
  differences: Losing signal, timeout and condition branches are dropped when the wait ends; losing child flows keep running, as SimPy leaves processes running.

- id: C2
  operation: Wait for all events
  simpy: "`simpy.events.AllOf`, `a & b`"
  yaml: "`wait: {all: {...}}`"
  builder: "`wait={\"all\": {...}}`"
  low_level: "`yield a & b`"
  checks:
    - tests/conformance/test_c2_wait_for_one_or_all.py::test_c2_wait_for_all_events
    - tests/conformance/test_c2_wait_for_one_or_all.py::test_c2_wait_for_all_events_with_a_failing_branch
  page: guides/wait-for-one-or-all.md#wait-for-all

- id: C4
  operation: Ordinary request and release
  simpy: "`simpy.resources.resource.Resource`"
  yaml: "`resource: packers` on a task"
  builder: "`@app.task(resource_id=\"packers\")`"
  low_level: "`with packers.request() as req: yield req`"
  checks:
    - tests/conformance/test_c4_resources.py::test_c4_ordinary_request_and_release
  page: user-guide/resources.md#declare-a-resource

- id: C4
  operation: Priority request
  simpy: "`simpy.resources.resource.PriorityResource`"
  yaml: "`queue: priority` on the resource and `priority` on a task"
  builder: "`add_resource(..., queue=\"priority\")` and `@app.task(priority=...)`"
  low_level: "`DynamicResource(..., queue=\"priority\")` and `request(priority=...)`"
  checks:
    - tests/conformance/test_c4_resources.py::test_c4_priority_resource_request
  page: user-guide/resources.md#task-priority
  differences: Equal priorities are served first in, first out, as in SimPy; desflow also offers `fifo` and `lifo` queues, under which a request's priority is ignored.

- id: C5
  operation: Bounded store put
  simpy: "`simpy.resources.store.Store.put`"
  yaml: "`put: {store: parcels}` on a task"
  builder: "`@app.task(put={\"store\": \"parcels\"})`"
  low_level: "`yield parcels.put(item)`"
  checks:
    - tests/conformance/test_c5_bounded.py::test_c5_bounded_store_put
  page: user-guide/stores-and-containers.md#take-and-add

- id: C5
  operation: Bounded store get
  simpy: "`simpy.resources.store.Store.get`"
  yaml: "`get: {store: parcels}` on a task"
  builder: "`@app.task(get={\"store\": \"parcels\"})`"
  low_level: "`item = yield parcels.get()`"
  checks:
    - tests/conformance/test_c5_bounded.py::test_c5_bounded_store_get
  page: user-guide/stores-and-containers.md#take-and-add

- id: C5
  operation: Bounded quantity put
  simpy: "`simpy.resources.container.Container.put`"
  yaml: "`put: {container: stock, amount: 2}` on a task"
  builder: "`@app.task(put={\"container\": \"stock\", \"amount\": 2})`"
  low_level: "`yield stock.put(2)`"
  checks:
    - tests/conformance/test_c5_bounded.py::test_c5_bounded_quantity_put
  page: tutorials/stock.md#take-and-restock

- id: C5
  operation: Bounded quantity get
  simpy: "`simpy.resources.container.Container.get`"
  yaml: "`get: {container: stock, amount: 1}` on a task"
  builder: "`@app.task(get={\"container\": \"stock\", \"amount\": 1})`"
  low_level: "`yield stock.get(1)`"
  checks:
    - tests/conformance/test_c5_bounded.py::test_c5_bounded_quantity_get
  page: tutorials/stock.md#take-and-restock

- id: C5
  operation: Priority item storage
  simpy: "`simpy.resources.store.PriorityStore`"
  yaml: "`stores.<name>.priority: true` and a `put` with `priority`"
  builder: "`add_store(..., priority=True)` and `put={\"store\": ..., \"priority\": ...}`"
  low_level: "`DynamicStore(..., priority=True)` with `simpy.PriorityItem`"
  checks:
    - tests/conformance/test_c5_priority_store.py::test_c5_priority_item_storage
    - tests/conformance/test_c5_priority_store.py::test_c5_priority_item_storage_equal_priorities
  page: user-guide/stores-and-containers.md#start-with-items-and-serve-by-priority
  differences: Equal priorities come out in put order in the builder and YAML, which add a rising put order to the priority; a plain SimPy `PriorityStore` gives no order among equal priorities.

- id: C5
  operation: Filtered retrieval
  simpy: "`simpy.resources.store.FilterStore.get(filter)`"
  yaml: "`get: {store: parcels, filter: item.area == attr.area}`"
  builder: "`get={\"store\": \"parcels\", \"filter\": ...}`, a condition or a function of the item"
  low_level: "`parcels.get(filter=lambda item: ...)`"
  checks:
    - tests/conformance/test_c5_inventory.py::test_c5_filtered_retrieval
  page: user-guide/stores-and-containers.md#pick-an-item-or-give-up-waiting
  differences: A priority store takes no filter, because SimPy has no store that both ranks and filters.

