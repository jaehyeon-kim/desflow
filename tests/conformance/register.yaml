- id: C2
  inventory: [SP-V9, SP-C1, SP-C3, SP-E7]
  operation: Wait for one event
  description: "A task waits for whichever of several events happens first, such as a delivery or a time limit."
  simpy: "`simpy.events.AnyOf`, `a | b`"
  yaml: "`wait: {any: {stock: {signal: restocked}, limit: {timeout: 3}}}`"
  builder: "`wait={\"any\": {...}}`"
  low_level: "`yield a | b`"
