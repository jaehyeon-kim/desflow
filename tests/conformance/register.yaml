- id: D
  inventory: [SP-S3]
  status: difference
  operation: Capacity 0
  simpy: "`resources.resource.Resource(capacity=0)` raises `ValueError`, and so do `Store` and `Container`"
  yaml: "`current_cap: 0` on a resource"
  builder: "`add_resource(name, current_cap=0)`"
  low_level: "`DynamicResource(env, ..., current_cap=0)`"
  checks: []
  differences: "A resource, store or container may have a capacity of 0, at the start or later, because its capacity changes during a run: a shift with no packers, a shelf that is closed. At capacity 0 a resource grants no request, and a store or container accepts no put, until the capacity rises; a get still takes what a store or container holds."
