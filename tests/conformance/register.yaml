# Differences kept by design, approved by the owner: A run with no until and
# Capacity 0 on 18 Oct 2026, Strict pacing at factor 0 on 21 Oct 2026 (D-E1).

- id: D
  inventory: [SP-E11]
  status: difference
  operation: A run with no until
  simpy: "`core.Environment.run()` returns when no event is left"
  checks: []
  differences: "A run with a sink or an ingress connector and no `until` runs for ever, because a live run has no end: the connectors keep events coming. Give it an `until`, with a `drain` when it should finish its work, or a `stop` that is sure to happen, or stop it with Ctrl+C."

- id: D
  inventory: []
  status: difference
  operation: Strict pacing at factor 0
  simpy: "`rt.RealtimeEnvironment(factor=0, strict=True)` raises once the wall clock has moved"
  checks: []
  differences: "An unpaced run has no wall clock to fall behind, so SimPy's check at factor 0 would raise on the first step of every unpaced script. `strict` is never checked at factor 0, also before `go_live_at`."
  page: user-guide/time-and-pacing/clocks-and-pacing.md#strict-pacing

- id: D
  inventory: [SP-S3]
  status: difference
  operation: Capacity 0
  simpy: "`resources.resource.Resource(capacity=0)` raises `ValueError`, and so do `Store` and `Container`"
  checks: []
  differences: "A resource, store or container may have a capacity of 0, at the start or later, because its capacity changes during a run: a shift with no packers, a shelf that is closed. At capacity 0 a resource grants no request, and a store or container accepts no put, until the capacity rises; a get still takes what a store or container holds."
