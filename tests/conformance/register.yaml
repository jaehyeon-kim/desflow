# The SimPy compatibility register: every modelling feature of SimPy, each with its
# status in YAML, the builder and the low-level API. A native row gives its form in
# each API, the conformance tests that compare it with plain SimPy (the version in
# uv.lock, which scripts/gen_pages.py names on the page) and the docs page that
# teaches it; a row not yet native gives the release that makes it native; a
# difference kept by design gives its reason. scripts/gen_pages.py writes the SimPy
# Compatibility page from this file, and tests/docs/test_gen_pages.py checks that
# every check names a test function, every test function here is listed, and every
# page exists.
#
# The register is the full list of SimPy 4.1.2's modelling features, 98 in all
# (planning research/simpy-4.1.2-inventory.md names each by its inventory id).
#
# id: the capability group (C1 to C7 core, S1 to S3 bounded support), N for a
#   feature not yet native, D for a difference kept by design
# inventory: the inventory ids of the SimPy features the row covers
# status: native (the default: native in all three APIs and checked against
#   SimPy), not yet, or difference
# release: for a row not yet native, the release that makes it native
# operation: what a model does
# simpy: the SimPy construct it corresponds to
# yaml, builder, low_level: one short form each
# checks: pytest node ids of the conformance tests
# page: the docs page and anchor that teaches it, relative to docs/
# differences: an intentional difference from SimPy, when there is one

- id: C1
  inventory: [V10]
  operation: Timed wait
  simpy: "`simpy.events.Timeout`"
  yaml: a task with `service` and no `resource`
  builder: "`@app.task(service_id=...)` with no resource"
  low_level: "`yield env.timeout(delay)`"
  checks:
    - tests/conformance/test_c1_timed_wait.py::test_c1_timed_wait
  page: user-guide/tasks-and-processes.md#a-timed-step

- id: C1
  inventory: [V1]
  operation: Signal event success and value
  simpy: "`simpy.events.Event.succeed(value)`"
  yaml: "`signals: [restocked]`, `signal: restocked` on the firing task and `wait: {signal: restocked}`"
  builder: "`add_signal`, `@app.task(signal=...)`, `wait={\"signal\": ...}`, or `context.signal(name).fire(value)`"
  low_level: "`Signal(env, name)`: `yield signal.wait()` and `signal.fire(value)`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_signal_event_success_and_value
    - tests/conformance/test_c1_process_interaction.py::test_c1_signal_waiter_after_a_firing_waits_for_the_next
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  inventory: [V2]
  operation: Signal event failure
