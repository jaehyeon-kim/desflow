  operation: Priority request
  simpy: "`simpy.resources.resource.PriorityResource`"
  yaml: "`queue: priority` on the resource and `priority` on a task"
  builder: "`add_resource(..., queue=\"priority\")` and `@app.task(priority=...)`"
  low_level: "`DynamicResource(..., queue=\"priority\")` and `request(priority=...)`"
  checks:
    - tests/conformance/test_c4_resources.py::test_c4_priority_resource_request
    - tests/conformance/test_c4_resources.py::test_c4_priority_request_with_mixed_preempt_flags
  page: user-guide/resources.md#task-priority
  differences: Equal priorities are served first in, first out, as in SimPy; desflow also offers `fifo` and `lifo` queues, under which a request's priority is ignored.

