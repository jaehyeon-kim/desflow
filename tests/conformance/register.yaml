  yaml: "`wait.inspect.value.<field>`, the last payload of the child flow"
  builder: "the same, or the value of `context.call(...)`"
  low_level: "`value = yield env.process(child())`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_return_value
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows

- id: C1
  inventory: [P3]
  operation: Process failure
  simpy: "an exception raised in a process reaches the process that waits for it"
  yaml: "`fail`, `fail_reason` and `on_fail` on a task; a failure no `on_fail` handles fails the waiting task"
  builder: "the same, and a function that raises fails its task"
  low_level: "`try: yield env.process(child())` and `except`"
  checks:
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_failure
    - tests/conformance/test_c1_process_interaction.py::test_c1_process_failure_handled_by_on_fail
  page: user-guide/tasks-and-processes.md#wait-signals-and-child-flows
  differences: In YAML and the builder a failure no task waits for ends the entity's flow, publishes `failed` and is counted, and the run goes on; in SimPy, and in the low-level API, an exception nobody handles stops the run.

