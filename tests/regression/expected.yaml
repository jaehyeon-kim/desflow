- run: blueprint:patience_tie_served.yaml
  since: 1.0.0
  changelog: "When a patience ends at the instant a unit is granted and the patience's event comes first, the task now reneges. Before, the task was served. The blueprint is removed with its test, which is replaced by test_patience_first_at_a_tie_reneges."
