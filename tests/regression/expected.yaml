- run: blueprint:c1_signals.yaml
  since: 0.29.0
  changelog: "A task with one `wait` branch now goes on in the step its event is processed, as `yield event` does in SimPy, so records at one instant can change order and a shared unit can go to another entity; to keep the old order, write the branch under `any`, as `wait: {any: {only: {timeout: 2}}}`."
