- run: file:docs/snippets/yaml/wait_for_one_or_all_example.yaml
  since: 1.0.0
  changelog: "A signal is one-shot by default: a second firing of a signal is refused, so a signal that fires more than once gets `once: false`. A wait for a signal that has fired resumes at once. Each random sequence of a seeded run is now named by the SHA-256 hash of its place, in place of a 32-bit CRC checksum that two places could share, so a seeded run draws other numbers than before."
- run: file:docs/snippets/yaml/wait_groups.yaml
  since: 1.0.0rc1
  changelog: "`next`, `on_fail` and `on_interrupt_next` now run the following task in the same process and the same step, so it asks for a unit before a child spawned at that instant, and a process you wait for ends when its whole flow ends; to let the child go first, give the following task `wait: {timeout: 0}`, which matches SimPy but does not restore the old records at ties above 1 (at 3 the old order is cuse-1, a-1, cuse-2, and now it is cuse-1, cuse-2, cuse-3). A `subscribe` interrupt or a preempted kept unit now reaches the following task, which `on_interrupt: abandon` cuts short. The Wait for One or All example asks for a packer with a priority and without preemption, and shows a signal that fires more than once and a spawned task, so every key of a wait has an example."
