- run: blueprint:c1_running.yaml
  since: 0.29.0
  changelog: "`next`, `on_fail` and `on_interrupt_next` now run the following task in the same process and the same step, so it asks for a unit before a child spawned at that instant, and a process you wait for ends when its whole flow ends; to let the child go first, give the following task `wait: {timeout: 0}`, which matches SimPy but does not restore the old records at ties above 1 (at 3 the old order is cuse-1, a-1, cuse-2, and now it is cuse-1, cuse-2, cuse-3). A `subscribe` interrupt or a preempted kept unit now reaches the following task, which `on_interrupt: abandon` cuts short."
