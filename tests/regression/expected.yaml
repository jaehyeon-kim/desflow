  changelog: "With `on_interrupt: resume` or `restart`, a plain interrupt no longer gives back a unit the task holds, so the task goes on at once with it and other entities waiting for the unit wait until the task ends. A task with several resources asks again only for the unit it lost or still waited for, so it can wait for one while it holds the others, and a task preempted on one resource, or broken down on one, keeps the rest. A unit the task before kept with `keep` stays until the task starts, unless its resource breaks down or a preemption takes it, and now goes back at once when the task reneges, its wait fails or its function raises with no `on_fail`, or it has no next task. With `resume`, a task interrupted at the exact end of its service now goes on one step later, after other processes whose service ends then, as `yield env.timeout(0)` does. A preemption or a breakdown still takes the unit. To give the unit back and queue again, use `on_interrupt: abandon` with `on_interrupt_next` naming a task that asks for it; that keeps neither the `resumed` record, nor the time left (the next task draws its own service time), nor the task's counts (the interrupted task counts `interrupted` and neither `resumed` nor `finished`, and the next task counts its own `finished`). `sim_ts` is no longer rounded to three decimals (T6), so a record shows the clock as it is. Each random sequence of a seeded run is now named by the SHA-256 hash of its place, in place of a 32-bit CRC checksum that two places could share, so a seeded run draws other numbers than before."
