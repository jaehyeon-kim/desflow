- run: file:docs/snippets/yaml/process_interaction.yaml
  since: 1.0.0
  changelog: "A signal is one-shot by default: a second firing of a signal is refused, so a signal that fires more than once gets `once: false`. A wait for a signal that has fired resumes at once. The Process Interaction example declares `courier_left` with `once: false`, because each courier fires it; signals are one-shot by default in 1.0."
