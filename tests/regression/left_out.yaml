# Files that `scripts/regression.py capture` does not run as blueprints (`_all_blueprints`), each with its reason.
# A file is left out when it is not a blueprint, has no end, needs a service, gives only
# an import error because its `!python` module is neither beside it nor in a folder it
# names, or gives a different capture on two runs of one commit. `capture` restores
# `sys.modules` and `sys.path` after each file, so each file is decided by running it alone.
# Paths are relative to the checkout.

