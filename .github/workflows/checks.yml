name: Checks

# The jobs that every run of pipeline.yml and full.yml runs. The plan job reads the
# caller's event (a called workflow keeps the caller's github context) and the changed
# files, and scripts/ci_plan.py decides which jobs and parts run (issue #90): a pull
# request tests Python 3.11 and 3.15, a push to main every Python from 3.11 to 3.15,
# and the schedule or a run by hand everything. A pull request or a push runs the docs
# tests only when the files they read change, and the integration and service example
# jobs only when what they cover changes.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    name: Plan the jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      docs: ${{ steps.plan.outputs.docs }}
      services: ${{ steps.plan.outputs.services }}
      unit: ${{ steps.plan.outputs.unit }}
      simpy: ${{ steps.plan.outputs.simpy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the changed files and plan the jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        # A push compares with the commit before it. A list that cannot be read stays
        # empty, and the plan then runs every job.
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE...HEAD" > changed.txt
          elif [ "$EVENT" = push ]; then
            git diff --name-only "$BEFORE" HEAD > changed.txt 2> /dev/null || : > changed.txt
          else
            : > changed.txt
          fi
          python3 scripts/ci_plan.py "$EVENT" < changed.txt | tee -a "$GITHUB_OUTPUT"

  # Linting is not version specific, so it runs once.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Runs pre-commit directly instead of through pre-commit/action. That
      # action's last release, v3.0.1, ran this same command, but it also uses
      # actions/cache@v4, which runs on the deprecated Node.js 20.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files

      # The import contracts in pyproject.toml, [tool.importlinter].
      - name: Check the import contracts
        run: uv run --all-extras lint-imports

  # The core install, then each extra alone, each in an empty environment, imports
  # and constructs what it exists to enable (scripts/install_checks/check_<name>.py).
  # Running the suite with --all-extras hides a missing transitive dependency in one
  # extra, because another extra supplies it. None of the checks opens a socket. The
  # core install also starts the desflow command and runs a YAML blueprint, as a new
  # user's first command does. One job loops over them, because each takes seconds
  # and most of a job's time is its setup.
  install-checks:
    name: Install the core and each extra alone
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install and check the core and each extra alone
        run: |
          set -euo pipefail
          extras=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']))")
          for name in core $extras; do
            echo "::group::$name"
            spec="."
            [ "$name" = core ] || spec=".[$name]"
            uv venv --python 3.12 "$RUNNER_TEMP/$name"
            uv pip install --python "$RUNNER_TEMP/$name" "$spec"
            "$RUNNER_TEMP/$name/bin/python" "scripts/install_checks/check_$name.py"
            echo "::endgroup::"
          done

      - name: Start the desflow command and run a YAML blueprint with the core install
        run: |
          "$RUNNER_TEMP/core/bin/desflow" --help
          "$RUNNER_TEMP/core/bin/desflow" schema > /dev/null
          "$RUNNER_TEMP/core/bin/desflow" run examples/yaml/local.yaml --until 2

  # The unit, conformance, benchtop and known case tests, in the jobs and parts that
  # scripts/ci_plan.py lists. A part (TEST_SHARD) is dealt by the time of each test in
  # tests/durations.json, so the parts of a job take about the same time. Each job
  # writes a JUnit file, from which scripts/test_durations.py records the times again.
  # The tests run in parallel worker processes (pytest-xdist, one per CPU).
  unit-test:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: uv run --python ${{ matrix.python }} --all-extras pytest ${{ matrix.paths }} -m "${{ matrix.marks }}" -q -n auto --tb=short --junitxml=junit.xml

      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ runner.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: junit.xml

  # SimPy is what desflow is checked against, so the conformance tests run at both
  # ends of the `simpy` requirement: the floor in pyproject.toml, on every run, and
  # the newest release, which may be newer than uv.lock until Dependabot updates it,
  # in the full set. The test jobs run them at the locked version. Only SimPy moves;
  # every other package stays at its locked version.
  simpy-range:
    name: Conformance at the ${{ matrix.bound }} SimPy
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bound: ${{ fromJSON(needs.plan.outputs.simpy) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Choose the SimPy version
        run: |
          if [ "${{ matrix.bound }}" = "lowest" ]; then
            floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'simpy>=([0-9.]+)', d).group(1) for d in deps if d.startswith('simpy')))")
            echo "SIMPY=simpy==$floor" >> "$GITHUB_ENV"
          else
            echo "SIMPY=simpy" >> "$GITHUB_ENV"
          fi

      - name: Run the conformance tests
        run: |
          uv run --all-extras --with "$SIMPY" python -c "import simpy; print('SimPy', simpy.__version__)"
          uv run --all-extras --with "$SIMPY" python -m pytest tests/conformance/ -q -n auto

  # One job per test group, named by its pytest mark: services (the odctl
  # kafka-lite, postgres and valkey profiles), storage (the odctl storage and
  # catalog profiles, and the SQL catalog test on the PostgreSQL that the catalog
  # profile starts), floci (the Floci AWS emulator), azure (Azurite) and gcp
  # (fake-gcs-server). The odctl tests are split in two so that neither job holds
  # up the stage. The emulators are containers that the tests start with
  # `docker run`.
  # They run in the full set, and on a pull request or a push that changes what they
  # cover.
  integration-test:
    name: Integration tests, ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [services, storage, floci, azure, gcp]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python 3.11
        run: uv python install 3.11

      # Example and test infrastructure comes from odctl, which the conftest
      # drives with `odctl up` and `odctl down`. odctl is in the dev dependency
      # group, so `uv run` installs it into .venv and puts it on PATH. Without
      # it on PATH the odctl tests fail, so fail here with a clearer message.
      - name: Verify odctl is on PATH
        if: matrix.group == 'services' || matrix.group == 'storage'
        run: |
          uv run --python 3.11 --all-extras python -c "import shutil, sys; path = shutil.which('odctl'); print(path or 'odctl not found on PATH'); sys.exit(0 if path else 1)"

      - name: Run the ${{ matrix.group }} integration tests
        # Run the group on a single baseline version. A test whose infrastructure is
        # missing fails when CI is set, and pytest exits with code 5 when the mark
        # selects no test, so a job cannot pass by testing nothing. -ra lists every
        # skipped test.
        run: uv run --python 3.11 --all-extras pytest tests/integration/ -m ${{ matrix.group }} -ra

  # One job per example with an odctl profile (`EXAMPLES` in src/desflow/examples.py;
  # tests/unit/test_service_examples_matrix.py fails when this list differs from it).
  # Each job starts the example's profile, runs the example's three versions against
  # it for a set simulation time, and reads their records back from the service.
  service-examples:
    name: Service example, ${{ matrix.example }}
    needs: plan
    if: needs.plan.outputs.services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [kafka, iceberg, postgres, redis, backfill-live, related-records]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python 3.11
        run: uv python install 3.11

      # odctl is in the dev dependency group, so `uv run` puts it on PATH.
      - name: Verify odctl is on PATH
        run: |
          uv run --python 3.11 --all-extras python -c "import shutil, sys; path = shutil.which('odctl'); print(path or 'odctl not found on PATH'); sys.exit(0 if path else 1)"

      # The profile is read from EXAMPLES, so it is written down once.
      - name: Find the profile of the ${{ matrix.example }} example
        id: profile
        run: |
          profile=$(uv run --python 3.11 --all-extras python -c "from desflow.examples import EXAMPLES; print(EXAMPLES['${{ matrix.example }}'].profile)")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Start the ${{ steps.profile.outputs.profile }} profile
        run: uv run --python 3.11 --all-extras odctl up ${{ steps.profile.outputs.profile }}

      # CI is set, so a profile that is not listening fails the test. pytest exits
      # with code 5 when -k selects no test, so a job cannot pass by testing nothing.
      - name: Run the ${{ matrix.example }} example
        run: uv run --python 3.11 --all-extras pytest tests/integration/test_service_examples.py -m examples -k ${{ matrix.example }} -ra

      - name: Stop the profile
        if: always()
        run: uv run --python 3.11 --all-extras odctl down ${{ steps.profile.outputs.profile }} --volumes

  # The Parquet example has no profile, because it needs a service only with its S3
  # variables, so service-examples does not cover its S3 read-back command.
  parquet-s3-example:
    name: Run the Parquet example against the storage profile
    needs: plan
    if: needs.plan.outputs.services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python 3.11
        run: uv python install 3.11

      - name: Start the storage profile
        run: uv run --python 3.11 --all-extras odctl up storage

      - name: Run the Parquet example and its read-back command
        run: uv run --python 3.11 --all-extras pytest tests/integration/test_service_examples.py -m examples -k parquet_page_s3

      - name: Stop the profile
        if: always()
        run: uv run --python 3.11 --all-extras odctl down storage --volumes

  # The docs tests check that every page's code matches its file, that the snippets
  # and examples run, and that the generated pages and record blocks are current.
  # They run in 8 groups at once, which tests/docs/conftest.py balances by the times
  # in tests/docs/durations.json, so each job finishes in a few minutes on the
  # runner's 2 CPUs. The strict build runs beside them and fails on a broken link or
  # anchor, so a pull request finds it before the docs job deploys from main. The
  # docs job waits for all of them, so the docs are only deployed from code that
  # passed them. Material prints a notice about MkDocs 2.0 that strict mode counts as
  # a warning; the variable turns that notice off.
  docs-build:
    name: Docs tests, part ${{ matrix.group }} of 8
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run group ${{ matrix.group }} of the docs and example tests
        env:
          DOCS_SHARD: ${{ matrix.group }}/8
        run: uv run --all-extras pytest tests/docs/ -q -n auto

  docs-strict-build:
    name: Docs strict build
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the docs in strict mode
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

  # Every example, conformance blueprint and regression scenario runs unpaced on the
  # last release from PyPI and on this commit, and the records are compared. A
  # difference fails the job unless tests/regression/expected.yaml lists it with a
  # `since` above the last release, so a commit that changes a record on purpose adds
  # its entry with the next version. The baseline is the newest `v*` tag in the
  # history, so once a release is tagged, later pushes are compared with it. The
  # baseline side runs from outside the repository, because uv run --no-project
  # inside it imports the working tree's desflow. The runs are captured in 6 parts at
  # once (`capture --shard`), and the regression job joins the parts and compares
  # them. The steps from "Check out v1.0.0" on pin 1.0 once the tag v1.0.0 exists.
  regression-capture:
    name: Regression capture, part ${{ matrix.part }} of 6
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check out the last release beside the repository
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          echo "BASELINE=${tag#v}" >> "$GITHUB_ENV"
          git worktree add "$RUNNER_TEMP/baseline" "$tag"
          mkdir -p "$RUNNER_TEMP/capture"

      - name: Capture this commit
        run: uv run --all-extras python scripts/regression.py capture --root . --shard ${{ matrix.part }}/6 --out "$RUNNER_TEMP/capture/new-${{ matrix.part }}.json"

      # On a pull request the last release's capture is kept between runs. It changes
      # only with the tag, the scenarios, the list of left-out files or the script, so
      # those are its key. A push and the full set capture it again.
      - name: Restore the capture of the last release
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/capture/old-${{ matrix.part }}.json
          key: regression-${{ env.BASELINE }}-${{ matrix.part }}-${{ hashFiles('tests/regression/scenarios/**', 'tests/regression/left_out.yaml', 'scripts/regression.py') }}

      - name: Capture the last release
        if: steps.baseline.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python 3.12 --with "desflow[all]==$BASELINE" --with pytest \
            python "$GITHUB_WORKSPACE/scripts/regression.py" capture \
            --root "$RUNNER_TEMP/baseline" \
            --scenarios "$GITHUB_WORKSPACE/tests/regression/scenarios" \
            --left-out "$GITHUB_WORKSPACE/tests/regression/left_out.yaml" \
            --shard ${{ matrix.part }}/6 \
            --out "$RUNNER_TEMP/capture/old-${{ matrix.part }}.json"

      # From the tag v1.0.0 on, the output of every 1.0 blueprint is pinned: both sides
      # run the files of v1.0.0 (its examples, blueprints, scenarios and its own
      # list of left-out files), one with the released desflow and one with this
      # commit's, so an edit to an example cannot hide a change in what a 1.0
      # blueprint does. A difference fails the job unless expected.yaml lists it
      # with a `since` above 1.0.0.
      - name: Check out v1.0.0 beside the repository
        id: pin
        run: |
          if git rev-parse --quiet --verify refs/tags/v1.0.0 > /dev/null; then
            git worktree add "$RUNNER_TEMP/v1.0.0" v1.0.0
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture the files of v1.0.0 on this commit
        if: steps.pin.outputs.exists == 'true'
        run: uv run --all-extras python scripts/regression.py capture --root "$RUNNER_TEMP/v1.0.0" --shard ${{ matrix.part }}/6 --out "$RUNNER_TEMP/capture/pin-new-${{ matrix.part }}.json"

      - name: Capture the files of v1.0.0 on desflow 1.0.0
        if: steps.pin.outputs.exists == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python 3.12 --with "desflow[all]==1.0.0" --with pytest \
            python "$GITHUB_WORKSPACE/scripts/regression.py" capture \
            --root "$RUNNER_TEMP/v1.0.0" \
            --shard ${{ matrix.part }}/6 \
            --out "$RUNNER_TEMP/capture/pin-old-${{ matrix.part }}.json"

      - name: Upload the captures
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.part }}
          path: ${{ runner.temp }}/capture/

  regression:
    name: Regression compare
    needs: [plan, regression-capture]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Download the captures of every part
        uses: actions/download-artifact@v8
        with:
          pattern: regression-*
          merge-multiple: true
          path: ${{ runner.temp }}/capture

      - name: Join the parts and compare the two captures
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          cd "$RUNNER_TEMP/capture"
          uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out old.json old-*.json
          uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out new.json new-*.json
          uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" compare old.json new.json --baseline "${tag#v}"

      - name: Join the parts and compare the two captures of the v1.0.0 files
        run: |
          cd "$RUNNER_TEMP/capture"
          if ls pin-new-*.json > /dev/null 2>&1; then
            uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out pin-old.json pin-old-*.json
            uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out pin-new.json pin-new-*.json
            uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" compare pin-old.json pin-new.json --baseline 1.0.0 --set-aside-absent
          fi
