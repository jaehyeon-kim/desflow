name: Publish to PyPI

on:
  release:
    types: [published] # ONLY triggers when a drafted release is published

jobs:
  pypi-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for desflow names no environment, so it accepts this one.
    environment: pypi
    # These permissions are strictly required for PyPI OIDC Trusted Publishing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      # A release tagged v0.16.0 must publish version 0.16.0, or PyPI receives a version
      # nobody released. Each plugin manifest must carry the same version, or the
      # plugin's users are not offered the update. The tag goes through env, not into
      # the script text.
      - name: Check the tag matches the package and plugin versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match v$VERSION in pyproject.toml"
            exit 1
          fi
          for manifest in plugin/.*-plugin/plugin.json; do
            PLUGIN=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")
            if [ "$TAG" != "v$PLUGIN" ]; then
              echo "Release tag $TAG does not match v$PLUGIN in $manifest"
              exit 1
            fi
          done

      - name: Build Wheel and sdist
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
