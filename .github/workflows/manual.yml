name: Manual tests

# The long tests, which pull-request.yml and pipeline.yml do not run: every test, with
# the tests marked every_model and the known cases, on Python 3.11, 3.12 and 3.15 on
# Ubuntu and on Python 3.12 on Windows; the paced cases; the conformance tests at the
# lowest and newest SimPy; the unit and conformance tests at the lowest Pydantic; the
# core install's time zone on Ubuntu and Windows; and the integration tests and
# service examples (services.yml), which pull-request.yml runs only when a change
# touches what they cover. macOS is not run: development is on a Mac, whose local
# pipeline runs the tests. Every day at 16:23 UTC (02:23 or 03:23 in
# Sydney), and by hand before a release: gh workflow run manual.yml --ref
# <branch>, with -f python="3.13" to test other versions on Ubuntu. GitHub starts a
# workflow by hand only when its file is on the default branch, so a pull request
# starts it from its own branch with the label `manual tests` (remove the label and
# add it again to start it again). A run started by any other label skips every job.
# A run has more than the 20 jobs GitHub runs at once, so the rest wait for a free
# runner.
on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:
    inputs:
      python:
        description: The Python versions to run every test on, on Ubuntu, separated by spaces
        type: string
        default: "3.11 3.12 3.15"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    name: Plan the jobs
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan the test jobs
        id: plan
        env:
          PYTHON_VERSIONS: ${{ inputs.python || '3.11 3.12 3.15' }}
        # With pipefail, the step fails when ci_plan.py fails, not only when tee does
        shell: bash
        run: python3 scripts/ci_plan.py manual "$PYTHON_VERSIONS" < /dev/null | tee -a "$GITHUB_OUTPUT"

  # Every test of the unit, conformance, benchtop and known case suites, with those
  # marked every_model, in the jobs and parts that scripts/ci_plan.py lists. A part
  # (TEST_SHARD) is dealt by the time of each test in tests/durations.json, so the
  # parts of a job take about the same time. Each job writes a JUnit file, from which
  # scripts/test_durations.py records the times again.
  # The tests run in parallel worker processes (pytest-xdist, one per CPU).
  unit-test:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: uv run --python ${{ matrix.python }} --all-extras pytest ${{ matrix.paths }} -m "${{ matrix.marks }}" -q -n auto --tb=short --junitxml=junit.xml

      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ runner.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: junit.xml

  # The known cases and unit tests that run against the wall clock, in a job of their
  # own, so the CPU time of other tests cannot make a strict case late. They time
  # themselves below one tick of the Windows clock, which is 15.6 ms before Python
  # 3.13 and 1 microsecond from it (the Python 3.13 changelog, "time"), so the
  # Windows runner runs them on 3.13.
  paced:
    name: Paced tests, Python ${{ matrix.python }}, ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the paced tests
        run: uv run --python ${{ matrix.python }} --all-extras pytest tests/known_cases tests/unit -m paced -q --tb=short

  # The conformance tests, with those marked every_model, at both ends of the `simpy`
  # requirement: the floor in pyproject.toml, and the newest release, which may be
  # newer than uv.lock until Dependabot updates it. pull-request.yml runs them at the
  # floor without the tests marked every_model. Only SimPy moves; every other package
  # stays at its locked version.
  simpy-range:
    name: Conformance at the ${{ matrix.bound }} SimPy
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bound: [lowest, newest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Choose the SimPy version
        run: |
          if [ "${{ matrix.bound }}" = "lowest" ]; then
            floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'simpy>=([0-9.]+)', d).group(1) for d in deps if d.startswith('simpy')))")
            echo "SIMPY=simpy==$floor" >> "$GITHUB_ENV"
          else
            echo "SIMPY=simpy" >> "$GITHUB_ENV"
          fi

      - name: Run the conformance tests
        run: |
          uv run --all-extras --with "$SIMPY" python -c "import simpy; print('SimPy', simpy.__version__)"
          uv run --all-extras --with "$SIMPY" python -m pytest tests/conformance/ -q -n auto

  # Pydantic is the other requirement whose floor the tests must reach. pyproject.toml
  # sets the floor, and uv.lock holds a newer release, so without this job nothing
  # would run the models on the floor itself. Only Pydantic moves; every other
  # package stays at its locked version. The floor's pydantic-core has wheels for
  # Python 3.12 and earlier only, so the job runs the lowest Python desflow supports.
  # The two schema tests compare a committed file with one that the installed
  # Pydantic writes, which another release may write differently. The public API
  # snapshot does the same for the signatures and fields of the Pydantic models. With
  # the tests marked every_model, the tests take about 120 minutes of test time, so
  # the job runs in 6 parts.
  pydantic-floor:
    name: Unit and conformance tests at the lowest Pydantic, part ${{ matrix.shard }} of 6
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read the Pydantic floor
        run: |
          floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'pydantic>=([0-9.]+)', d).group(1) for d in deps if d.startswith('pydantic')))")
          echo "PYDANTIC=pydantic==$floor" >> "$GITHUB_ENV"

      - name: Run the unit and conformance tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
        run: |
          uv run --python 3.11 --all-extras --with "$PYDANTIC" python -c "import pydantic; print('Pydantic', pydantic.VERSION)"
          uv run --python 3.11 --all-extras --with "$PYDANTIC" python -m pytest tests/unit tests/conformance -q -n auto --deselect tests/unit/test_schema.py::test_committed_schema_is_current --deselect tests/unit/test_explain.py::test_json_validates_and_the_committed_schema_is_current --deselect tests/unit/test_public_api.py::test_public_api_matches_the_snapshot

  # --all-extras installs pandas, which brings tzdata, so the test jobs cannot show
  # whether the core install has a time zone database. Windows has none of its own,
  # and an Ubuntu runner has the system one.
  core-install:
    name: Resolve a time zone with the core install on ${{ matrix.system }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, system: Ubuntu }
          - { os: windows-latest, system: Windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the core package in a new environment
        run: |
          uv venv --python 3.12 core-venv
          uv pip install --python core-venv .

      - name: Resolve a time zone
        run: uv run --no-project --python core-venv python -c "from desflow.core.environment import resolve_zone; print(resolve_zone('Australia/Sydney'))"

  # The integration tests and the service examples, which a pull request runs only
  # when a change touches the files scripts/ci_plan.py lists. A change to another
  # module, such as the Builder's tasks, is tested here.
  services:
    name: Service tests
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    uses: ./.github/workflows/services.yml
