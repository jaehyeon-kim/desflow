name: Pull request

# A pull request to main (issue #90). It tests Python 3.11, the lowest version desflow
# supports; a push to main (pipeline.yml) tests 3.12 to 3.15 on the merged code, and
# manual.yml runs the long tests. It runs the docs tests when the files they read
# change, and the integration and service example jobs when what they cover changes.
# The jobs are sized so a run has at most 20 at once, the limit of the plan, and so no
# job takes much longer than a part of the unit tests. The plan job reads the changed
# files, and scripts/ci_plan.py decides. Every other job starts as soon as the plan is
# read, and checks-passed collects their results.
on:
  pull_request:
    branches: [main]

# Read-only, so a pull request build cannot write to the repository
permissions:
  contents: read

# A new push to a pull request supersedes the run already going for it, so the older
# run is cancelled rather than finishing work nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan the jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      docs: ${{ steps.plan.outputs.docs }}
      services: ${{ steps.plan.outputs.services }}
      unit: ${{ steps.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the changed files and plan the jobs
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # The files the pull request changes against its base
        run: |
          git diff --name-only "$BASE...HEAD" > changed.txt
          python3 scripts/ci_plan.py pull_request < changed.txt | tee -a "$GITHUB_OUTPUT"

  # Linting and the strict docs build are not version specific, so they run once. The
  # strict build fails on a broken link or anchor, so a pull request finds it before
  # pipeline.yml deploys the docs from main. Material prints a notice about MkDocs 2.0
  # that strict mode counts as a warning; the variable turns that notice off.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Runs pre-commit directly instead of through pre-commit/action. That
      # action's last release, v3.0.1, ran this same command, but it also uses
      # actions/cache@v4, which runs on the deprecated Node.js 20.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files

      # The import contracts in pyproject.toml, [tool.importlinter].
      - name: Check the import contracts
        run: uv run --all-extras lint-imports

      - name: Build the docs in strict mode
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

  # The core install, then each extra alone, each in an empty environment, imports
  # and constructs what it exists to enable (scripts/install_checks/check_<name>.py).
  # Running the suite with --all-extras hides a missing transitive dependency in one
  # extra, because another extra supplies it. None of the checks opens a socket. The
  # core install also starts the desflow command and runs a YAML blueprint, as a new
  # user's first command does. One job loops over them, because each takes seconds
  # and most of a job's time is its setup.
  #
  # The same job runs the conformance tests at the floor of the `simpy` requirement in
  # pyproject.toml, because SimPy is what desflow is checked against. The test jobs run
  # them at the locked version, and manual.yml at the floor and the newest release
  # with the tests marked every_model too. Only SimPy moves; every other package stays
  # at its locked version.
  install-checks:
    name: Install the core and each extra alone, and conformance at the lowest SimPy
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install and check the core and each extra alone
        run: |
          set -euo pipefail
          extras=$(python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']))")
          for name in core $extras; do
            echo "::group::$name"
            spec="."
            [ "$name" = core ] || spec=".[$name]"
            uv venv --python 3.12 "$RUNNER_TEMP/$name"
            uv pip install --python "$RUNNER_TEMP/$name" "$spec"
            "$RUNNER_TEMP/$name/bin/python" "scripts/install_checks/check_$name.py"
            echo "::endgroup::"
          done

      - name: Start the desflow command and run a YAML blueprint with the core install
        run: |
          "$RUNNER_TEMP/core/bin/desflow" --help
          "$RUNNER_TEMP/core/bin/desflow" schema > /dev/null
          "$RUNNER_TEMP/core/bin/desflow" run examples/yaml/local.yaml --until 2

      - name: Run the conformance tests at the lowest SimPy
        run: |
          floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'simpy>=([0-9.]+)', d).group(1) for d in deps if d.startswith('simpy')))")
          uv run --all-extras --with "simpy==$floor" python -c "import simpy; print('SimPy', simpy.__version__)"
          uv run --all-extras --with "simpy==$floor" python -m pytest tests/conformance/ -m "not every_model" -q -n auto

  # The unit, conformance, benchtop and known case tests, in the jobs and parts that
  # scripts/ci_plan.py lists. A part (TEST_SHARD) is dealt by the time of each test in
  # tests/durations.json, so the parts of a job take about the same time. Each job
  # writes a JUnit file, from which scripts/test_durations.py records the times again.
  # The tests run in parallel worker processes (pytest-xdist, one per CPU).
  unit-test:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: uv run --python ${{ matrix.python }} --all-extras pytest ${{ matrix.paths }} -m "${{ matrix.marks }}" -q -n auto --tb=short --junitxml=junit.xml

      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ runner.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: junit.xml

  # The integration tests and the service examples, in three jobs of about the length
  # of a part of the unit tests. The integration tests are chosen by their pytest marks:
  # services (the odctl kafka-lite, postgres and valkey profiles), storage (the odctl
  # storage and catalog profiles, and the SQL catalog test on the PostgreSQL that the
  # catalog profile starts), and floci, azure and gcp (emulators that the tests start
  # with `docker run`). The integration conftest starts and stops the odctl profiles
  # it needs. The examples (`EXAMPLES` in src/desflow/examples.py) run their three
  # versions against their profiles, which the job reads from EXAMPLES and starts;
  # tests/unit/test_service_examples_matrix.py fails when the examples listed here
  # differ from those with a profile. The Parquet example has no profile, because it
  # needs a service only with its S3 variables, so its group starts the storage
  # profile for its S3 read-back command. CI is set, so a test whose infrastructure is
  # missing fails, and pytest exits with code 5 when a selection finds no test, so a
  # job cannot pass by testing nothing.
  services:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Integration tests, services and emulators
            marks: services or floci or azure or gcp
          - name: Integration tests on storage, and the Iceberg and Parquet examples
            marks: storage
            examples: [iceberg]
            parquet: true
          - name: Service examples, Kafka, PostgreSQL and Redis
            examples: [kafka, backfill-live, postgres, related-records, redis]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python 3.11
        run: uv python install 3.11

      # odctl is in the dev dependency group, so `uv run` installs it into .venv and
      # puts it on PATH. Without it the tests fail, so fail here with a clearer message.
      - name: Verify odctl is on PATH
        run: |
          uv run --python 3.11 --all-extras python -c "import shutil, sys; path = shutil.which('odctl'); print(path or 'odctl not found on PATH'); sys.exit(0 if path else 1)"

      - name: Run the integration tests
        if: matrix.marks
        run: uv run --python 3.11 --all-extras pytest tests/integration/ -m "${{ matrix.marks }}" -ra

      # The profiles come from EXAMPLES, so each is written down once
      - name: Find the profiles and tests of the examples
        if: matrix.examples || matrix.parquet
        id: examples
        env:
          NAMES: ${{ toJSON(matrix.examples) }}
          PARQUET: ${{ matrix.parquet }}
        run: |
          uv run --python 3.11 --all-extras python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          from desflow.examples import EXAMPLES
          names = json.loads(os.environ["NAMES"]) or []
          profiles = list(dict.fromkeys(EXAMPLES[name].profile for name in names))
          keys = list(names)
          if os.environ["PARQUET"] == "true":
              profiles.append("storage")
              keys.append("parquet_page_s3")
          print("profiles=" + " ".join(dict.fromkeys(profiles)))
          print("keys=" + " or ".join(keys))
          PY

      - name: Start the profiles
        if: steps.examples.outputs.profiles
        run: |
          for profile in ${{ steps.examples.outputs.profiles }}; do
            uv run --python 3.11 --all-extras odctl up "$profile"
          done

      - name: Run the examples
        if: steps.examples.outputs.keys
        run: uv run --python 3.11 --all-extras pytest tests/integration/test_service_examples.py -m examples -k "${{ steps.examples.outputs.keys }}" -ra

      - name: Stop the profiles
        if: always() && steps.examples.outputs.profiles
        run: |
          for profile in ${{ steps.examples.outputs.profiles }}; do
            uv run --python 3.11 --all-extras odctl down "$profile" --volumes
          done

  # The docs tests check that every page's code matches its file, that the snippets
  # and examples run, and that the generated pages and record blocks are current.
  # They run in 5 groups at once, which tests/docs/conftest.py balances by the times
  # in tests/docs/durations.json, so each job takes about 8 minutes on the runner's
  # 2 CPUs.
  docs-build:
    name: Docs tests, part ${{ matrix.group }} of 5
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run group ${{ matrix.group }} of the docs and example tests
        env:
          DOCS_SHARD: ${{ matrix.group }}/5
        run: uv run --all-extras pytest tests/docs/ -q -n auto

  # Every example, conformance blueprint and regression scenario runs unpaced on the
  # last release from PyPI and on this commit, and the records are compared. A
  # difference fails the job unless tests/regression/expected.yaml lists it with a
  # `since` above the last release, so a commit that changes a record on purpose adds
  # its entry with the next version. The baseline is the newest `v*` tag in the
  # history, so once a release is tagged, later pushes are compared with it. The
  # baseline side runs from outside the repository, because uv run --no-project
  # inside it imports the working tree's desflow. The runs are captured in 3 parts at
  # once (`capture --shard`), and the regression job joins the parts and compares
  # them. The steps from "Check out v1.0.0" on pin 1.0 once the tag v1.0.0 exists.
  regression-capture:
    name: Regression capture, part ${{ matrix.part }} of 3
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check out the last release beside the repository
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          echo "BASELINE=${tag#v}" >> "$GITHUB_ENV"
          git worktree add "$RUNNER_TEMP/baseline" "$tag"
          mkdir -p "$RUNNER_TEMP/capture"

      - name: Capture this commit
        run: uv run --all-extras python scripts/regression.py capture --root . --shard ${{ matrix.part }}/3 --out "$RUNNER_TEMP/capture/new-${{ matrix.part }}.json"

      # On a pull request the last release's capture is kept between runs. It changes
      # only with the tag, the scenarios, the list of left-out files or the script, so
      # those are its key. A push captures it again.
      - name: Restore the capture of the last release
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/capture/old-${{ matrix.part }}.json
          key: regression-${{ env.BASELINE }}-${{ matrix.part }}-${{ hashFiles('tests/regression/scenarios/**', 'tests/regression/left_out.yaml', 'scripts/regression.py') }}

      - name: Capture the last release
        if: steps.baseline.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python 3.12 --with "desflow[all]==$BASELINE" --with pytest \
            python "$GITHUB_WORKSPACE/scripts/regression.py" capture \
            --root "$RUNNER_TEMP/baseline" \
            --scenarios "$GITHUB_WORKSPACE/tests/regression/scenarios" \
            --left-out "$GITHUB_WORKSPACE/tests/regression/left_out.yaml" \
            --shard ${{ matrix.part }}/3 \
            --out "$RUNNER_TEMP/capture/old-${{ matrix.part }}.json"

      # From the tag v1.0.0 on, the output of every 1.0 blueprint is pinned: both sides
      # run the files of v1.0.0 (its examples, blueprints, scenarios and its own
      # list of left-out files), one with the released desflow and one with this
      # commit's, so an edit to an example cannot hide a change in what a 1.0
      # blueprint does. A difference fails the job unless expected.yaml lists it
      # with a `since` above 1.0.0.
      - name: Check out v1.0.0 beside the repository
        id: pin
        run: |
          if git rev-parse --quiet --verify refs/tags/v1.0.0 > /dev/null; then
            git worktree add "$RUNNER_TEMP/v1.0.0" v1.0.0
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture the files of v1.0.0 on this commit
        if: steps.pin.outputs.exists == 'true'
        run: uv run --all-extras python scripts/regression.py capture --root "$RUNNER_TEMP/v1.0.0" --shard ${{ matrix.part }}/3 --out "$RUNNER_TEMP/capture/pin-new-${{ matrix.part }}.json"

      - name: Capture the files of v1.0.0 on desflow 1.0.0
        if: steps.pin.outputs.exists == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python 3.12 --with "desflow[all]==1.0.0" --with pytest \
            python "$GITHUB_WORKSPACE/scripts/regression.py" capture \
            --root "$RUNNER_TEMP/v1.0.0" \
            --shard ${{ matrix.part }}/3 \
            --out "$RUNNER_TEMP/capture/pin-old-${{ matrix.part }}.json"

      - name: Upload the captures
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.part }}
          path: ${{ runner.temp }}/capture/

  regression:
    name: Regression compare
    needs: [plan, regression-capture]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Download the captures of every part
        uses: actions/download-artifact@v8
        with:
          pattern: regression-*
          merge-multiple: true
          path: ${{ runner.temp }}/capture

      - name: Join the parts and compare the two captures
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          cd "$RUNNER_TEMP/capture"
          uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out old.json old-*.json
          uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out new.json new-*.json
          uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" compare old.json new.json --baseline "${tag#v}"

      - name: Join the parts and compare the two captures of the v1.0.0 files
        run: |
          cd "$RUNNER_TEMP/capture"
          if ls pin-new-*.json > /dev/null 2>&1; then
            uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out pin-old.json pin-old-*.json
            uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" merge --out pin-new.json pin-new-*.json
            uv run --project "$GITHUB_WORKSPACE" --all-extras python "$GITHUB_WORKSPACE/scripts/regression.py" compare pin-old.json pin-new.json --baseline 1.0.0 --set-aside-absent
          fi

  # The one check that branch protection on main requires. A job skipped because a
  # job it needs failed would not block a merge (GitHub docs, "Troubleshooting
  # required status checks"), so this job runs whatever happened and fails when any
  # job failed or was cancelled. A job the plan skipped counts as passed.
  checks-passed:
    name: checks-passed
    if: always()
    needs: [plan, lint, install-checks, unit-test, services, docs-build, regression-capture, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          sys.exit(any(r in ("failure", "cancelled") for r in results.values()))
          PY
