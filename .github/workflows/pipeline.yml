name: Pipeline

# A push to main (issue #90). The pull request (pull-request.yml) ran the lint, the
# install checks, the conformance tests at the lowest SimPy, the unit tests on Python
# 3.11, the regression, the docs tests and the service jobs on the same code, because
# branch protection requires a pull request to be up to date with main. So this run
# tests what the pull request did not: Python 3.12 to 3.15. It builds the docs in
# strict mode, and deploys them when both pass. The README badge shows this workflow.
on:
  push:
    branches: [main]

# Read-only by default. The docs job raises its own permissions, because it is the
# only one that pushes.
permissions:
  contents: read

# Every push to main completes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    name: Plan the jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      unit: ${{ steps.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the changed files and plan the jobs
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        # The files the push changes. A list that cannot be read stays empty, and the
        # plan then runs every job.
        run: |
          git diff --name-only "$BEFORE" HEAD > changed.txt 2> /dev/null || : > changed.txt
          python3 scripts/ci_plan.py push < changed.txt | tee -a "$GITHUB_OUTPUT"

  # The unit, conformance, benchtop and known case tests, in the jobs and parts that
  # scripts/ci_plan.py lists. A part (TEST_SHARD) is dealt by the time of each test in
  # tests/durations.json, so the parts of a job take about the same time. Each job
  # writes a JUnit file, from which scripts/test_durations.py records the times again.
  # The tests run in parallel worker processes (pytest-xdist, one per CPU).
  unit-test:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: uv run --python ${{ matrix.python }} --all-extras pytest ${{ matrix.paths }} -m "${{ matrix.marks }}" -q -n auto --tb=short --junitxml=junit.xml

      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ runner.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: junit.xml

  # The strict build fails on a broken link or anchor, so a broken page is never
  # deployed. Material prints a notice about MkDocs 2.0 that strict mode counts as a
  # warning; the variable turns that notice off.
  docs-strict-build:
    name: Docs strict build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the docs in strict mode
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

  docs:
    name: Deploy the docs
    needs: [unit-test, docs-strict-build]
    permissions:
      contents: write
      pages: write
    # A push that changes only files no code job reads (the site's styles and scripts,
    # mkdocs.yml, the top-level Markdown files) skips the unit tests, and the docs still
    # deploy
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Mike needs the full history to pull the gh-pages branch

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and Deploy Docs (Versioned)
        run: |
          # Configure Git for the bot commit
          git config --global user.name "jaehyeon-kim"
          git config --global user.email "1023748+jaehyeon-kim@users.noreply.github.com"

          # Dynamically extract the version string from pyproject.toml
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Extracted version: $VERSION"

          # Deploy the extracted version and tag it as 'latest'
          uv run mike deploy --update-aliases $VERSION latest

          # Set 'latest' as the default landing page when navigating to the root URL
          uv run mike set-default latest

          # GitHub Pages answers every missing path under the site with the 404.html
          # at the root of gh-pages, but mike writes one into each version folder
          # only. Copy this version's page to the root. Its links point at latest/,
          # so it renders at any depth.
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp "$RUNNER_TEMP/gh-pages/$VERSION/404.html" "$RUNNER_TEMP/gh-pages/404.html"
          # Assistants look for llms.txt at the root of the site. Its links already
          # point at latest/, so the copy works from there.
          cp "$RUNNER_TEMP/gh-pages/$VERSION/llms.txt" "$RUNNER_TEMP/gh-pages/llms.txt"
          cp "$RUNNER_TEMP/gh-pages/$VERSION/llms-full.txt" "$RUNNER_TEMP/gh-pages/llms-full.txt"
          # Each version folder holds its own copy of every image. Store the images of
          # the versions other than latest once, in a folder they share, so the site
          # stays under the 1 GB that Pages publishes, and shrink their PNGs.
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends pngquant
          uv run python scripts/pages_images.py "$RUNNER_TEMP/gh-pages" --compress
          git -C "$RUNNER_TEMP/gh-pages" add -A
          git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet || git -C "$RUNNER_TEMP/gh-pages" commit -m "Root 404 page and llms.txt from $VERSION, and shared images of the older versions"
          # mike commits to the local gh-pages branch (after updating it from the remote),
          # so everything above goes out in one push and starts one Pages build.
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
