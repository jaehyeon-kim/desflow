name: Pipeline

# A push to main (issue #90). The pull request (pull-request.yml) ran every test of
# CI on the same code, because branch protection requires a pull request to be up to
# date with main. So this run only builds the docs in strict mode, and deploys them
# when the build passes. The README badge shows this workflow.
on:
  push:
    branches: [main]

# Read-only by default. The docs job raises its own permissions, because it pushes.
permissions:
  contents: read

# Every push to main completes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The strict build fails on a broken link or anchor, so a broken page is never
  # deployed. Material prints a notice about MkDocs 2.0 that strict mode counts as a
  # warning; the variable turns that notice off.
  docs-strict-build:
    name: Docs strict build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the docs in strict mode
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

  docs:
    name: Deploy the docs
    needs: docs-strict-build
    permissions:
      contents: write
      pages: write
    # docs.yml deploys too; both push to gh-pages, so one deploy waits for the other
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Mike needs the full history to pull the gh-pages branch

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and deploy the docs (versioned)
        run: bash scripts/deploy_docs.sh
