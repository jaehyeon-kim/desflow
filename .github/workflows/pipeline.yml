name: Pipeline

# A pull request and a push to main. The jobs are in checks.yml; the daily full set is
# full.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default, so a pull request build cannot write to the repository.
# The docs job raises its own permissions, because it is the only one that pushes.
permissions:
  contents: read

# A new push to a pull request supersedes the run already going for it, so the older
# run is cancelled rather than finishing work nobody reads. Pushes always complete,
# because cancel-in-progress is limited to pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # The one check that branch protection on main requires. A job skipped because a
  # job it needs failed would not block a merge (GitHub docs, "Troubleshooting
  # required status checks"), so this job runs whatever happened and fails when any
  # job in checks.yml failed or was cancelled. A job the plan skipped counts as
  # passed.
  checks-passed:
    name: checks-passed
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          sys.exit(any(r in ("failure", "cancelled") for r in results.values()))
          PY


  docs:
    name: Deploy the docs
    needs: checks-passed
    permissions:
      contents: write
      pages: write
    # A push to main only, not a pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Mike needs the full history to pull the gh-pages branch

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and Deploy Docs (Versioned)
        run: |
          # Configure Git for the bot commit
          git config --global user.name "jaehyeon-kim"
          git config --global user.email "1023748+jaehyeon-kim@users.noreply.github.com"

          # Dynamically extract the version string from pyproject.toml
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Extracted version: $VERSION"

          # Deploy the extracted version and tag it as 'latest'
          uv run mike deploy --update-aliases $VERSION latest

          # Set 'latest' as the default landing page when navigating to the root URL
          uv run mike set-default latest

          # GitHub Pages answers every missing path under the site with the 404.html
          # at the root of gh-pages, but mike writes one into each version folder
          # only. Copy this version's page to the root. Its links point at latest/,
          # so it renders at any depth.
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp "$RUNNER_TEMP/gh-pages/$VERSION/404.html" "$RUNNER_TEMP/gh-pages/404.html"
          # Assistants look for llms.txt at the root of the site. Its links already
          # point at latest/, so the copy works from there.
          cp "$RUNNER_TEMP/gh-pages/$VERSION/llms.txt" "$RUNNER_TEMP/gh-pages/llms.txt"
          cp "$RUNNER_TEMP/gh-pages/$VERSION/llms-full.txt" "$RUNNER_TEMP/gh-pages/llms-full.txt"
          git -C "$RUNNER_TEMP/gh-pages" add 404.html llms.txt llms-full.txt
          git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet || git -C "$RUNNER_TEMP/gh-pages" commit -m "Root 404 page and llms.txt from $VERSION"
          # mike commits to the local gh-pages branch (after updating it from the remote),
          # so everything above goes out in one push and starts one Pages build.
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
