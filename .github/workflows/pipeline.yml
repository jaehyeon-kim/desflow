name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default, so a pull request build cannot write to the repository.
# The docs job raises its own permissions, because it is the only one that pushes.
permissions:
  contents: read

# A new push to a pull request supersedes the run already going for it, so the older
# run is cancelled rather than finishing work nobody reads. Pushes to main always
# complete, because cancel-in-progress is limited to pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stages, each starting only when the one before it passes:
  # 1. checks, in parallel: lint, extras-isolation and core-install;
  # 2. tests, in parallel: unit-test, integration-test, blueprint, simpy-range and
  #    docs-build;
  # 3. docs, on main only, once every test job has passed.
  # The unit, conformance and docs tests run in parallel worker processes
  # (pytest-xdist, -n auto, one worker per CPU).
  # Linting is not version specific, so it runs once rather than in all five
  # unit-test legs, where a single hook failure used to fail the matrix five times.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Runs pre-commit directly instead of through pre-commit/action. That
      # action's last release, v3.0.1, ran this same command, but it also uses
      # actions/cache@v4, which runs on the deprecated Node.js 20.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files

  # Each leg installs exactly one extra into an empty environment, then imports and
  # constructs the connectors that extra exists to enable. Running the suite with
  # --all-extras hides a missing transitive dependency in one extra, because another
  # extra supplies it. None of these constructors open a socket, so no broker,
  # registry or database is needed.
  extras-isolation:
    name: Import ${{ matrix.extra }} extra alone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: kafka
            check: |
              from desflow import KafkaAdminConnector, KafkaEgress, KafkaIngress

              KafkaEgress(bootstrap_servers="localhost:9092")
              KafkaIngress(topic="sim-config", bootstrap_servers="localhost:9092")
              KafkaAdminConnector(bootstrap_servers="localhost:9092")
          - extra: confluent
            check: |
              import json

              from desflow.connectors.egress.kafka import ConfluentAvroSerializer
              from desflow.connectors.ingress.kafka import ConfluentAvroDeserializer

              schema = json.dumps(
                  {
                      "type": "record",
                      "name": "Ping",
                      "fields": [{"name": "value", "type": "double"}],
                  }
              )
              ConfluentAvroSerializer(registry_url="http://localhost:8081", schema_str=schema)
              ConfluentAvroDeserializer(registry_url="http://localhost:8081")
          - extra: glue
            check: |
              import json

              from desflow.connectors.egress.kafka import GlueAvroSerializer
              from desflow.connectors.ingress.kafka import GlueAvroDeserializer

              schema = json.dumps(
                  {
                      "type": "record",
                      "name": "Ping",
                      "fields": [{"name": "value", "type": "double"}],
                  }
              )
              GlueAvroSerializer(registry_name="sim-registry", schema_str=schema)
              GlueAvroDeserializer(registry_name="sim-registry")
          - extra: redis
            check: |
              from desflow import RedisEgress, RedisIngress

              RedisEgress(url="redis://localhost:6379/0")
              RedisIngress(url="redis://localhost:6379/0")
          - extra: postgres
            check: |
              from desflow import PostgresEgress, PostgresIngress

              PostgresEgress(connection_dsn="postgresql://user:pass@localhost:5432/sim")
              PostgresIngress(connection_dsn="postgresql://user:pass@localhost:5432/sim")
          - extra: parquet
            check: |
              from desflow import JsonlStorageEgress, ParquetStorageEgress

              JsonlStorageEgress(default_path="data/events.jsonl")
              ParquetStorageEgress(default_path="data/events.parquet")

              # Both writers import pyarrow lazily inside their run loops, so
              # constructing them does not prove pyarrow is installed.
              import pyarrow.parquet
              from pyarrow import fs
          - extra: iceberg
            check: |
              from desflow import IcebergStorageEgress

              IcebergStorageEgress(catalog=object(), default_table="sim.events")

              # The connector takes the catalog from the caller and imports pyarrow
              # lazily, so constructing it proves neither is installed. The REST
              # catalog client and the Arrow FileIO are what the extra has to carry.
              from pyiceberg.catalog.rest import RestCatalog
              from pyiceberg.io.pyarrow import PyArrowFileIO
          - extra: fit
            check: |
              import numpy as np

              from desflow import fit_column

              # fit_column and plot import scipy and matplotlib only when they run
              values = np.random.default_rng(1).gamma(4.0, 0.4, 50)
              result = fit_column(values, lower=0)
              assert result.best is not None, result.text()
              result.plot("fit.png")
          - extra: all
            check: |
              # all names every other extra, fit included
              import importlib.util

              for module in (
                  "aiokafka", "kafka", "confluent_kafka", "aws_schema_registry",
                  "boto3", "redis", "asyncpg", "pyarrow", "pyiceberg", "scipy",
                  "matplotlib",
              ):
                  assert importlib.util.find_spec(module), module
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install only the ${{ matrix.extra }} extra
        run: |
          uv venv --python 3.12
          uv pip install ".[${{ matrix.extra }}]"

      - name: Import and construct the ${{ matrix.extra }} connectors
        env:
          CHECK: ${{ matrix.check }}
        run: .venv/bin/python -c "$CHECK"

  # The core install alone must import and start the desflow command, which proves the
  # entry point, Typer and PyYAML need no extra.
  core-install:
    name: Import the core install alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package with no extra
        run: |
          uv venv --python 3.12
          uv pip install .

      - name: Import desflow and start the desflow command
        run: |
          .venv/bin/python -c "import desflow"
          .venv/bin/desflow --help

  unit-test:
    needs: [lint, extras-isolation, core-install]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Unit and Conformance Tests
        # --python is what selects the interpreter. `uv python install` above only
        # downloads it, so without this every leg of the matrix would run the
        # version in .python-version and the other three would test nothing new.
        run: uv run --python ${{ matrix.python-version }} --with pytest-cov --all-extras pytest tests/unit/ tests/conformance/ -n auto --cov=src/desflow --cov-report=xml

  # SimPy is what desflow is checked against, so the conformance tests run at both
  # ends of the `simpy` requirement: the floor in pyproject.toml and the newest
  # release, which may be newer than uv.lock until Dependabot updates it. Only
  # SimPy moves; every other package stays at its locked version.
  simpy-range:
    name: Conformance at the ${{ matrix.bound }} SimPy
    needs: [lint, extras-isolation, core-install]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bound: [lowest, newest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Choose the SimPy version
        run: |
          if [ "${{ matrix.bound }}" = "lowest" ]; then
            floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'simpy>=([0-9.]+)', d).group(1) for d in deps if d.startswith('simpy')))")
            echo "SIMPY=simpy==$floor" >> "$GITHUB_ENV"
          else
            echo "SIMPY=simpy" >> "$GITHUB_ENV"
          fi

      - name: Run the conformance tests
        run: |
          uv run --all-extras --with "$SIMPY" python -c "import simpy; print('SimPy', simpy.__version__)"
          uv run --all-extras --with "$SIMPY" pytest tests/conformance/ -q -n auto

  integration-test:
    needs: [lint, extras-isolation, core-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python 3.11
        run: uv python install 3.11

      # Example and test infrastructure comes from odctl, which the conftest
      # drives with `odctl up` and `odctl down`. odctl is in the dev dependency
      # group, so `uv run` installs it into .venv and puts it on PATH. Without
      # it on PATH every container-backed test skips instead of failing, and the
      # job reports green while testing nothing, so fail here if it is missing.
      - name: Verify odctl is on PATH
        run: |
          uv run --python 3.11 --all-extras python -c "import shutil, sys; path = shutil.which('odctl'); print(path or 'odctl not found on PATH'); sys.exit(0 if path else 1)"

      - name: Run Integration Tests
        # Run tests/integration on a single baseline version. -ra lists every
        # skipped test, so an unexpected skip is visible in the job log.
        run: uv run --python 3.11 --all-extras pytest tests/integration/ -ra

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     file: ./coverage.xml

  # A plain YAML blueprint runs with the core install alone, as a new user's first
  # command does.
  blueprint:
    name: Run a YAML blueprint with the core install alone
    needs: [lint, extras-isolation, core-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package with no extra
        run: |
          uv venv --python 3.12
          uv pip install .

      - name: Run the local blueprint for two simulation seconds
        run: .venv/bin/desflow run examples/yaml/local.yaml --until 2

  # The docs tests check that every page's code matches its file, that the snippets
  # and examples run, and that the generated pages and record blocks are current. A
  # strict build fails on a broken link or anchor, so a pull request finds it before
  # the docs job deploys from main. It runs beside the other tests; the docs job waits
  # for all of them, so the docs are only deployed from code that passed them.
  # Material prints a notice about MkDocs 2.0 that strict mode counts as a warning;
  # the variable turns that notice off.
  docs-build:
    needs: [lint, extras-isolation, core-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run the docs and example tests
        run: uv run --all-extras pytest tests/docs/ -q -n auto

      - name: Build the docs in strict mode
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: uv run mkdocs build --strict

  docs:
    needs: [unit-test, integration-test, blueprint, simpy-range, docs-build]
    permissions:
      contents: write
      pages: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Mike needs the full history to pull the gh-pages branch

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and Deploy Docs (Versioned)
        run: |
          # Configure Git for the bot commit
          git config --global user.name "jaehyeon-kim"
          git config --global user.email "1023748+jaehyeon-kim@users.noreply.github.com"

          # Dynamically extract the version string from pyproject.toml
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Extracted version: $VERSION"

          # Deploy the extracted version and tag it as 'latest'
          uv run mike deploy --update-aliases $VERSION latest

          # Set 'latest' as the default landing page when navigating to the root URL
          uv run mike set-default latest

          # GitHub Pages answers every missing path under the site with the 404.html
          # at the root of gh-pages, but mike writes one into each version folder
          # only. Copy this version's page to the root. Its links point at latest/,
          # so it renders at any depth.
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp "$RUNNER_TEMP/gh-pages/$VERSION/404.html" "$RUNNER_TEMP/gh-pages/404.html"
          # Assistants look for llms.txt at the root of the site. Its links already
          # point at latest/, so the copy works from there.
          cp "$RUNNER_TEMP/gh-pages/$VERSION/llms.txt" "$RUNNER_TEMP/gh-pages/llms.txt"
          cp "$RUNNER_TEMP/gh-pages/$VERSION/llms-full.txt" "$RUNNER_TEMP/gh-pages/llms-full.txt"
          git -C "$RUNNER_TEMP/gh-pages" add 404.html llms.txt llms-full.txt
          git -C "$RUNNER_TEMP/gh-pages" diff --cached --quiet || git -C "$RUNNER_TEMP/gh-pages" commit -m "Root 404 page and llms.txt from $VERSION"
          # mike commits to the local gh-pages branch (after updating it from the remote),
          # so everything above goes out in one push and starts one Pages build.
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages
