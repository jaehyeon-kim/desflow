name: Full set

# Everything, every day at 17:00 UTC (03:00 or 04:00 in Melbourne), and by hand before
# a release: gh workflow run full.yml --ref <branch>. GitHub starts a workflow by hand
# only when its file is on the default branch, so a pull request starts it from its
# own branch with the label `full set`:
# gh pr edit <n> --remove-label "full set" && gh pr edit <n> --add-label "full set".
# The jobs of checks.yml run their
# full set (the tests marked every_model, the known cases, Windows, macOS, the newest
# SimPy, the docs and the service jobs), and the jobs below run only here.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# A label other than `full set` starts a run whose jobs are all skipped.
jobs:
  checks:
    name: Checks
    if: github.event_name != 'pull_request' || github.event.label.name == 'full set'
    uses: ./.github/workflows/checks.yml
    with:
      full: true

  # --all-extras installs pandas, which brings tzdata, so the test jobs cannot show
  # whether the core install has a time zone database on Windows.
  windows-core-install:
    name: Resolve a time zone with the core install on Windows
    if: github.event_name != 'pull_request' || github.event.label.name == 'full set'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the core package in a new environment
        run: |
          uv venv --python 3.12 core-venv
          uv pip install --python core-venv .

      - name: Resolve a time zone
        run: uv run --no-project --python core-venv python -c "from desflow.core.environment import resolve_zone; print(resolve_zone('Australia/Sydney'))"

  # The known cases that run against the wall clock, in a job of their own, so the
  # CPU time of other tests cannot make a strict case late. They time themselves
  # below one tick of the Windows clock, which is 15.6 ms before Python 3.13 and 1
  # microsecond from it (the Python 3.13 changelog, "time"), so the Windows runner
  # runs them on 3.13.
  paced:
    name: Paced known cases, Python ${{ matrix.python }}, ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'full set'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the paced known cases
        run: uv run --python ${{ matrix.python }} --all-extras pytest tests/known_cases -m paced -q --tb=short

  # Pydantic is the other requirement whose floor the tests must reach. pyproject.toml
  # sets the floor, and uv.lock holds a newer release, so without this job nothing
  # would run the models on the floor itself. Only Pydantic moves; every other
  # package stays at its locked version. The floor's pydantic-core has wheels for
  # Python 3.12 and earlier only, so the job runs the lowest Python desflow supports.
  # The two schema tests compare a committed file with one that the installed
  # Pydantic writes, which another release may write differently. The public API
  # snapshot does the same for the signatures and fields of the Pydantic models. It
  # runs in two parts, without the tests marked every_model.
  pydantic-floor:
    name: Unit and conformance tests at the lowest Pydantic, part ${{ matrix.shard }} of 2
    if: github.event_name != 'pull_request' || github.event.label.name == 'full set'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read the Pydantic floor
        run: |
          floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'pydantic>=([0-9.]+)', d).group(1) for d in deps if d.startswith('pydantic')))")
          echo "PYDANTIC=pydantic==$floor" >> "$GITHUB_ENV"

      - name: Run the unit and conformance tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          uv run --python 3.11 --all-extras --with "$PYDANTIC" python -c "import pydantic; print('Pydantic', pydantic.VERSION)"
          uv run --python 3.11 --all-extras --with "$PYDANTIC" python -m pytest tests/unit tests/conformance -m "not every_model" -q -n auto --deselect tests/unit/test_schema.py::test_committed_schema_is_current --deselect tests/unit/test_explain.py::test_json_validates_and_the_committed_schema_is_current --deselect tests/unit/test_public_api.py::test_public_api_matches_the_snapshot
