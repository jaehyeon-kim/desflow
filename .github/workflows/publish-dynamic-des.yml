name: Publish the last dynamic-des release

# dynamic-des is the name of desflow before 0.20.0. Its last release, in
# compat/dynamic-des/, installs desflow. Run this once, by hand,
# after desflow 0.20.0 is on PyPI.
on:
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish dynamic-des
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for dynamic-des names this workflow and no environment.
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel and sdist
        run: uv build compat/dynamic-des --out-dir dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
