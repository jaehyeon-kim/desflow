name: Platforms

# The 1.0 build runs the unit and conformance tests on Linux and Windows on each
# push to its branch, because pipeline.yml runs only on main and on pull requests.
# macOS is covered by the local pipeline, which runs on a Mac.
on:
  push:
    branches: [release-1.0.0]

permissions:
  contents: read

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python 3.12
        run: uv python install 3.12

      - name: Run Unit and Conformance Tests
        run: uv run --python 3.12 --all-extras pytest tests/unit tests/conformance tests/benchtop tests/known_cases -m "not paced" -q -n auto --tb=short

      # The paced cases time themselves below one tick of the Windows clock, which is
      # 15.6 ms before Python 3.13 and 1 microsecond from it (the Python 3.13 changelog,
      # "time"), so the Windows runner runs them on 3.13. Linux keeps 3.12, as the step
      # above does.
      - name: Run Paced Known Cases
        if: runner.os != 'Windows'
        run: uv run --python 3.12 --all-extras pytest tests/known_cases -m paced -q --tb=short

      - name: Fetch Python 3.13
        if: runner.os == 'Windows'
        run: uv python install 3.13

      - name: Run Paced Known Cases on Python 3.13
        if: runner.os == 'Windows'
        run: uv run --python 3.13 --all-extras pytest tests/known_cases -m paced -q --tb=short

  core-install:
    # --all-extras installs pandas, which brings tzdata, so the job above cannot show
    # whether the core install has a time zone database on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the core package in a new environment
        run: |
          uv venv --python 3.12 core-venv
          uv pip install --python core-venv .

      - name: Resolve a time zone
        run: uv run --no-project --python core-venv python -c "from desflow.core.environment import resolve_zone; print(resolve_zone('Australia/Sydney'))"
