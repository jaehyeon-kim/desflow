name: Manual tests

# The long tests, which pipeline.yml does not run: every test, with the tests marked
# every_model and the known cases, on Python 3.12 on Ubuntu, Windows and macOS; the
# paced cases; the lowest Pydantic and the newest SimPy; the core install on Windows;
# and the integration and service example jobs. Every day at 17:00 UTC (03:00 or 04:00
# in Melbourne), and by hand before a release: gh workflow run manual.yaml --ref
# <branch>. GitHub starts a workflow by hand only when its file is on the default
# branch, so a pull request starts it from its own branch with the label
# `manual tests` (remove the label and add it again to start it again). A run started
# by any other label skips every job.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    name: Plan the jobs
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan the test jobs
        id: plan
        run: python3 scripts/ci_plan.py manual < /dev/null | tee -a "$GITHUB_OUTPUT"

  # Every test of the unit, conformance, benchtop and known case suites, with those
  # marked every_model, in the jobs and parts that scripts/ci_plan.py lists. A part (TEST_SHARD) is dealt by the time of each test in
  # tests/durations.json, so the parts of a job take about the same time. Each job
  # writes a JUnit file, from which scripts/test_durations.py records the times again.
  # The tests run in parallel worker processes (pytest-xdist, one per CPU).
  unit-test:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.unit) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: uv run --python ${{ matrix.python }} --all-extras pytest ${{ matrix.paths }} -m "${{ matrix.marks }}" -q -n auto --tb=short --junitxml=junit.xml

      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ runner.os }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: junit.xml

  # The known cases that run against the wall clock, in a job of their own, so the
  # CPU time of other tests cannot make a strict case late. They time themselves
  # below one tick of the Windows clock, which is 15.6 ms before Python 3.13 and 1
  # microsecond from it (the Python 3.13 changelog, "time"), so the Windows runner
  # runs them on 3.13.
  paced:
    name: Paced known cases, Python ${{ matrix.python }}, ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Run the paced known cases
        run: uv run --python ${{ matrix.python }} --all-extras pytest tests/known_cases -m paced -q --tb=short

  # The conformance tests at the newest SimPy release, which may be newer than uv.lock
  # until Dependabot updates it. pipeline.yml runs them at the floor. Only SimPy
  # moves; every other package stays at its locked version.
  simpy-range:
    name: Conformance at the ${{ matrix.bound }} SimPy
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bound: [newest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Choose the SimPy version
        run: |
          if [ "${{ matrix.bound }}" = "lowest" ]; then
            floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'simpy>=([0-9.]+)', d).group(1) for d in deps if d.startswith('simpy')))")
            echo "SIMPY=simpy==$floor" >> "$GITHUB_ENV"
          else
            echo "SIMPY=simpy" >> "$GITHUB_ENV"
          fi

      - name: Run the conformance tests
        run: |
          uv run --all-extras --with "$SIMPY" python -c "import simpy; print('SimPy', simpy.__version__)"
          uv run --all-extras --with "$SIMPY" python -m pytest tests/conformance/ -q -n auto

  # Pydantic is the other requirement whose floor the tests must reach. pyproject.toml
  # sets the floor, and uv.lock holds a newer release, so without this job nothing
  # would run the models on the floor itself. Only Pydantic moves; every other
  # package stays at its locked version. The floor's pydantic-core has wheels for
  # Python 3.12 and earlier only, so the job runs the lowest Python desflow supports.
  # The two schema tests compare a committed file with one that the installed
  # Pydantic writes, which another release may write differently. The public API
  # snapshot does the same for the signatures and fields of the Pydantic models. It
  # runs in two parts, without the tests marked every_model.
  pydantic-floor:
    name: Unit and conformance tests at the lowest Pydantic, part ${{ matrix.shard }} of 2
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read the Pydantic floor
        run: |
          floor=$(python3 -c "import re, tomllib; deps = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.fullmatch(r'pydantic>=([0-9.]+)', d).group(1) for d in deps if d.startswith('pydantic')))")
          echo "PYDANTIC=pydantic==$floor" >> "$GITHUB_ENV"

      - name: Run the unit and conformance tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          uv run --python 3.11 --all-extras --with "$PYDANTIC" python -c "import pydantic; print('Pydantic', pydantic.VERSION)"
          uv run --python 3.11 --all-extras --with "$PYDANTIC" python -m pytest tests/unit tests/conformance -m "not every_model" -q -n auto --deselect tests/unit/test_schema.py::test_committed_schema_is_current --deselect tests/unit/test_explain.py::test_json_validates_and_the_committed_schema_is_current --deselect tests/unit/test_public_api.py::test_public_api_matches_the_snapshot

  # --all-extras installs pandas, which brings tzdata, so the test jobs cannot show
  # whether the core install has a time zone database on Windows.
  windows-core-install:
    name: Resolve a time zone with the core install on Windows
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the core package in a new environment
        run: |
          uv venv --python 3.12 core-venv
          uv pip install --python core-venv .

      - name: Resolve a time zone
        run: uv run --no-project --python core-venv python -c "from desflow.core.environment import resolve_zone; print(resolve_zone('Australia/Sydney'))"

  # One job per test group, named by its pytest mark: services (the odctl
  # kafka-lite, postgres and valkey profiles), storage (the odctl storage and
  # catalog profiles, and the SQL catalog test on the PostgreSQL that the catalog
  # profile starts), floci (the Floci AWS emulator), azure (Azurite) and gcp
  # (fake-gcs-server). The odctl tests are split in two so that neither job holds
  # up the stage. The emulators are containers that the tests start with
  # `docker run`.
  # pipeline.yml runs them only when a change touches what they cover.
  integration-test:
    name: Integration tests, ${{ matrix.group }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [services, storage, floci, azure, gcp]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Pre-downloads the interpreter. `uv run --python` below is what selects it.
      - name: Fetch Python 3.11
        run: uv python install 3.11

      # Example and test infrastructure comes from odctl, which the conftest
      # drives with `odctl up` and `odctl down`. odctl is in the dev dependency
      # group, so `uv run` installs it into .venv and puts it on PATH. Without
      # it on PATH the odctl tests fail, so fail here with a clearer message.
      - name: Verify odctl is on PATH
        if: matrix.group == 'services' || matrix.group == 'storage'
        run: |
          uv run --python 3.11 --all-extras python -c "import shutil, sys; path = shutil.which('odctl'); print(path or 'odctl not found on PATH'); sys.exit(0 if path else 1)"

      - name: Run the ${{ matrix.group }} integration tests
        # Run the group on a single baseline version. A test whose infrastructure is
        # missing fails when CI is set, and pytest exits with code 5 when the mark
        # selects no test, so a job cannot pass by testing nothing. -ra lists every
        # skipped test.
        run: uv run --python 3.11 --all-extras pytest tests/integration/ -m ${{ matrix.group }} -ra

  # One job per example with an odctl profile (`EXAMPLES` in src/desflow/examples.py;
  # tests/unit/test_service_examples_matrix.py fails when this list, or the one in
  # pipeline.yml, differs from it).
  # Each job starts the example's profile, runs the example's three versions against
  # it for a set simulation time, and reads their records back from the service.
  service-examples:
    name: Service example, ${{ matrix.example }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [kafka, iceberg, postgres, redis, backfill-live, related-records]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python 3.11
        run: uv python install 3.11

      # odctl is in the dev dependency group, so `uv run` puts it on PATH.
      - name: Verify odctl is on PATH
        run: |
          uv run --python 3.11 --all-extras python -c "import shutil, sys; path = shutil.which('odctl'); print(path or 'odctl not found on PATH'); sys.exit(0 if path else 1)"

      # The profile is read from EXAMPLES, so it is written down once.
      - name: Find the profile of the ${{ matrix.example }} example
        id: profile
        run: |
          profile=$(uv run --python 3.11 --all-extras python -c "from desflow.examples import EXAMPLES; print(EXAMPLES['${{ matrix.example }}'].profile)")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Start the ${{ steps.profile.outputs.profile }} profile
        run: uv run --python 3.11 --all-extras odctl up ${{ steps.profile.outputs.profile }}

      # CI is set, so a profile that is not listening fails the test. pytest exits
      # with code 5 when -k selects no test, so a job cannot pass by testing nothing.
      - name: Run the ${{ matrix.example }} example
        run: uv run --python 3.11 --all-extras pytest tests/integration/test_service_examples.py -m examples -k ${{ matrix.example }} -ra

      - name: Stop the profile
        if: always()
        run: uv run --python 3.11 --all-extras odctl down ${{ steps.profile.outputs.profile }} --volumes

  # The Parquet example has no profile, because it needs a service only with its S3
  # variables, so service-examples does not cover its S3 read-back command.
  parquet-s3-example:
    name: Run the Parquet example against the storage profile
    if: github.event_name != 'pull_request' || github.event.label.name == 'manual tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Fetch Python 3.11
        run: uv python install 3.11

      - name: Start the storage profile
        run: uv run --python 3.11 --all-extras odctl up storage

      - name: Run the Parquet example and its read-back command
        run: uv run --python 3.11 --all-extras pytest tests/integration/test_service_examples.py -m examples -k parquet_page_s3

      - name: Stop the profile
        if: always()
        run: uv run --python 3.11 --all-extras odctl down storage --volumes
