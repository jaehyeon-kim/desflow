version: 2
updates:
  # Automate GitHub Actions updates (e.g., checkout@v6 -> v7)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies: the uv ecosystem updates uv.lock, so the versions CI tests,
  # SimPy above all, follow new releases. The pip ecosystem left the lower bounds
  # in pyproject.toml alone and never touched uv.lock, so CI kept testing SimPy
  # 4.1.1 after 4.1.2 was what users installed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
